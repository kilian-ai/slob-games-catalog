{"content":"<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>Snake</title><style>*{margin:0;padding:0;box-sizing:border-box}body{width:390px;height:844px;overflow:hidden;background:#0a0a0a;color:#e0e0e0;font-family:system-ui,sans-serif;user-select:none}#hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}#hdr .title{font-size:22px;font-weight:700}.accent{color:#00ff88}#score{font-size:22px;font-weight:700;color:#00ff88}#hs{font-size:11px;color:#555;margin-top:2px}#cw{display:flex;justify-content:center;padding:0 20px}canvas{border-radius:8px;border:1px solid #1a1a1a}#ctrl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px}#ctrl .row{display:flex;gap:4px}.btn{width:68px;height:52px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s}.btn:active,.btn.pressed{background:rgba(0,255,136,.15);border-color:#00ff88}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,10,.92);text-align:center;z-index:20}#overlay.off{display:none}#overlay h2{font-size:30px;font-weight:700;margin-bottom:8px}#overlay p{color:#666;font-size:13px;margin-bottom:24px}#overlay button{background:rgba(0,255,136,.15);border:1px solid #00ff88;color:#00ff88;padding:12px 36px;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}</style></head><body><div id=\"hdr\"><div><div class=\"title\"><span class=\"accent\">Snake</span></div><div id=\"hs\">best: 0</div></div><div id=\"score\">0</div></div><div id=\"cw\"><canvas id=\"c\" width=\"350\" height=\"560\"></canvas></div><div id=\"ctrl\"><div class=\"row\"><div class=\"btn\" id=\"bU\">▲</div></div><div class=\"row\"><div class=\"btn\" id=\"bL\">◄</div><div class=\"btn\" style=\"visibility:hidden\">▼</div><div class=\"btn\" id=\"bR\">►</div></div><div class=\"row\"><div class=\"btn\" id=\"bD\">▼</div></div></div><div id=\"overlay\"><h2 id=\"otitle\">🐍 Snake</h2><p id=\"otext\">Tap buttons or use arrow keys</p><button id=\"obtn\">Start</button></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d'),C=25,R=40,CW=cv.width/C,CH=cv.height/R;let sn,dir,nd,fd,sc,hs=0,running=false,iv;const seEl=document.getElementById('score'),hsEl=document.getElementById('hs'),ov=document.getElementById('overlay'),ot=document.getElementById('otitle'),op=document.getElementById('otext'),ob=document.getElementById('obtn');function rn(n){return Math.floor(Math.random()*n)}function spawnFood(){let p;do{p={x:rn(C),y:rn(R)}}while(sn.some(s=>s.x===p.x&&s.y===p.y));fd=p}function init(){const mx=Math.floor(C/2),my=Math.floor(R/2);sn=[{x:mx,y:my},{x:mx-1,y:my},{x:mx-2,y:my}];dir={x:1,y:0};nd={x:1,y:0};sc=0;seEl.textContent=0;spawnFood()}function step(){dir=nd;const h={(x:(sn[0].x+dir.x+C)%C),(y:(sn[0].y+dir.y+R)%R)};if(sn.some(s=>s.x===h.x&&s.y===h.y)){over();return}sn.unshift(h);if(h.x===fd.x&&h.y===fd.y){sc++;seEl.textContent=sc;if(sc>hs){hs=sc;hsEl.textContent='best: '+hs}spawnFood()}else{sn.pop()}draw()}function draw(){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#111';ctx.lineWidth=.5;for(let i=0;i<=C;i++){ctx.beginPath();ctx.moveTo(i*CW,0);ctx.lineTo(i*CW,cv.height);ctx.stroke()}for(let j=0;j<=R;j++){ctx.beginPath();ctx.moveTo(0,j*CH);ctx.lineTo(cv.width,j*CH);ctx.stroke()}ctx.shadowColor='#ff4444';ctx.shadowBlur=10;ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(fd.x*CW+CW/2,fd.y*CH+CH/2,Math.min(CW,CH)*.38,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;sn.forEach((s,i)=>{const t=i/sn.length;ctx.fillStyle=i===0?'#00ff88':`hsl(${145-t*30},${80-t*20}%,${50-t*15}%)`;const p=i===0?1:2;if(ctx.roundRect){ctx.beginPath();ctx.roundRect(s.x*CW+p,s.y*CH+p,CW-p*2,CH-p*2,i===0?4:3);ctx.fill()}else{ctx.fillRect(s.x*CW+p,s.y*CH+p,CW-p*2,CH-p*2)}})}function over(){clearInterval(iv);running=false;ot.textContent='💀 Game Over';op.textContent='Score: '+sc;ob.textContent='Play Again';ov.classList.remove('off')}function start(){ov.classList.add('off');init();clearInterval(iv);running=true;iv=setInterval(step,120)}ob.addEventListener('click',start);const DM={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};function tryDir(d){if(running&&!(d.x===-dir.x&&d.y===-dir.y))nd=d}function onKey(e){if(!running){if(e.key==='Enter')start();return}const d=DM[e.key];if(d){tryDir(d);e.preventDefault()}}window.addEventListener('keydown',onKey);document.addEventListener('keydown',onKey);document.getElementById('bU').addEventListener('click',()=>tryDir({x:0,y:-1}));document.getElementById('bD').addEventListener('click',()=>tryDir({x:0,y:1}));document.getElementById('bL').addEventListener('click',()=>tryDir({x:-1,y:0}));document.getElementById('bR').addEventListener('click',()=>tryDir({x:1,y:0}));let tx=0,ty=0;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(!running)return;if(Math.abs(dx)>Math.abs(dy)){tryDir(dx>0?{x:1,y:0}:{x:-1,y:0})}else{tryDir(dy>0?{x:0,y:1}:{x:0,y:-1})}});draw();</script><script>\n(function(){\n  var t = window.traits;\n  if (!t || !t.score) return;\n  var _last = 0;\n  var _lastInit = '';\n  function getPlayerInitials() {\n    try { if (typeof getHighScore === 'function') { var h = getHighScore(); return h.initials || h.initial || ''; } } catch(e) {}\n    try { if (typeof highInitials === 'string' && highInitials) return highInitials; } catch(e) {}\n    try { if (typeof highInits === 'string' && highInits) return highInits; } catch(e) {}\n    try {\n      var hs = document.getElementById('hs');\n      if (hs) { var m = hs.textContent.match(/^([A-Z]{2,4})\\s/); if (m) return m[1]; }\n    } catch(e) {}\n    try {\n      for (var i = 0; i < localStorage.length; i++) {\n        var val = localStorage.getItem(localStorage.key(i));\n        if (!val) continue;\n        var sm = val.match(/^([A-Z]{2,4})\\s+\\d+$/);\n        if (sm) return sm[1];\n        try {\n          var obj = JSON.parse(val);\n          if (typeof obj === 'object' && obj) {\n            var init = obj.initials || obj.inits || obj.init || '';\n            if (init && typeof init === 'string' && init.length <= 4) return init;\n            if (obj.name && typeof obj.name === 'string' && obj.name.length <= 4 && typeof obj.score === 'number') return obj.name;\n          }\n        } catch(e2) {}\n      }\n    } catch(e) {}\n    return '';\n  }\n  function report(v) {\n    v = parseInt(v);\n    if (isNaN(v) || v < 0) return;\n    var init = getPlayerInitials();\n    if (v > _last || (v === _last && init && init !== _lastInit)) {\n      _last = v;\n      _lastInit = init;\n      t.score(v, init);\n    }\n  }\n  var el = document.getElementById('score');\n  if (el) {\n    new MutationObserver(function(){ report(el.textContent); })\n      .observe(el, {childList:true, characterData:true, subtree:true});\n  }\n  setInterval(function(){\n    try { if (typeof score === 'number') report(score); } catch(e){}\n    try { if (typeof game === 'object' && game && typeof game.score === 'number') report(game.score); } catch(e){}\n  }, 500);\n  function updateHS(sc, pl) {\n    var hs = document.getElementById('hs');\n    if (!hs) return;\n    var cur = hs.textContent.match(/(\\d+)/);\n    if (!cur || parseInt(cur[1]) >= sc) return;\n    var lbl = hs.textContent.match(/^(best|hi|hs|high)\\s*:\\s*/i);\n    var prefix = lbl ? lbl[0] : '';\n    hs.textContent = prefix + (pl ? pl + ' ' : '') + sc;\n  }\n  var synced = t.score();\n  var sv = (typeof synced === 'object' && synced) ? (synced.score || 0) : (synced || 0);\n  var sp = (typeof synced === 'object' && synced) ? (synced.player || '') : '';\n  if (sv > 0) updateHS(sv, sp);\n  window.addEventListener('message', function(e){\n    if (e.data && e.data.type === 'highscore-update' && e.data.score > 0) {\n      updateHS(e.data.score, e.data.player || '');\n    }\n  });\n})();\n</script>\n</body></html>","created":"2026-04-17T20:41:03Z","game_key":"kilian-ai/s12985b83f1f","id":"kilian-ai__s12985b83f1f-260417204103-1","name":"Snake Classic","resources":{},"version":"260416.210017"}
