{"content":"<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Arcanoid Ultra</title>\n  <style>\n    html, body {\n      width: 390px;\n      height: 844px;\n      margin: 0;\n      padding: 0;\n      background: #0a0a0a;\n      overflow: hidden;\n    }\n    body {\n      width: 390px;\n      height: 844px;\n      overflow: hidden;\n      margin: 0;\n    }\n    canvas {\n      display: block;\n      width: 390px;\n      height: 844px;\n      margin: 0;\n      background: #0a0a0a;\n      box-shadow: 0 8px 32px #010a;\n    }\n    #mute-btn {\n      position: absolute;\n      left: 322px;\n      top: 18px;\n      z-index: 11;\n      width: 44px;\n      height: 44px;\n      background: #181824;\n      border-radius: 50%;\n      border: 2px solid #4fc3f7;\n      outline: none;\n      cursor: pointer;\n      transition: background 0.18s;\n      color: #00ff88;\n      font-size: 1.7em;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    #mute-btn.muted { color: #888; border-color: #888; background: #201920; }\n    #initials-prompt {\n      display: none;\n      position: absolute;\n      left: 0; right: 0;\n      top: 0; bottom: 0;\n      width: 390px; height: 844px;\n      background: rgba(0,0,0,0.88);\n      z-index: 1000;\n      align-items: center;\n      justify-content: center;\n      flex-direction: column;\n    }\n    #initials-form {\n      background: #222a;\n      border-radius: 12px;\n      box-shadow: 0 4px 32px #01ff9955;\n      padding: 32px 20px 24px 20px;\n      display: flex; flex-direction: column; align-items: center;\n    }\n    #initials-form label {\n      color: #4fc3f7; font-size: 1.2em; letter-spacing: 2px; font-family:monospace;\n    }\n    #initials-input {\n      margin: 12px 0 14px 0; border-radius: 6px; border: 2px solid #00ff88; background: #101d; color: #00ff88;\n      font-size: 2em; width: 70px; text-align: center; letter-spacing: 7px; text-transform:uppercase;\n      outline: none; font-weight: 600; padding: 4px;\n    }\n    #initials-submit {\n      margin-top: 8px; font-size: 1.15em; padding: 6px 26px; border-radius: 8px; background: #00ff88; color: #102;\n      border: none; cursor: pointer; font-family: monospace; letter-spacing: 2px; font-weight: 600;\n    }\n  </style>\n</head>\n<body>\n  <canvas id=\"game\" width=\"390\" height=\"844\"></canvas>\n  <button id=\"mute-btn\" title=\"Mute/unmute sound\"><span id=\"mute-icon\">🔊</span></button>\n  <div id=\"initials-prompt\" style=\"display:none;\">\n    <form id=\"initials-form\" autocomplete=\"off\">\n      <label for=\"initials-input\">NEW HIGH SCORE!</label>\n      <input id=\"initials-input\" type=\"text\" maxlength=\"3\" autofocus autocorrect=\"off\" autocomplete=\"off\" spellcheck=\"false\" />\n      <button type=\"submit\" id=\"initials-submit\">OK</button>\n    </form>\n  </div>\n<script>\n/***** GAME CONSTANTS & DATA *****/\nlet WIDTH = 390, HEIGHT = 844;\nlet BG_COLORS = [\"#101920\", \"#0a1731\", \"#1a192c\", \"#220d11\", \"#112a24\", \"#170f31\", \"#211618\", \"#153828\", \"#232d29\"];\nlet LEVELS = [\n  {name:'LAUNCH PAD', layout: [5,5,5,5,5,0,0], color:'#00ff88'},\n  {name:'TWIST RUN', layout: [3,6,2,7,3,7,6], color:'#4fc3f7'},\n  {name:'BLOCKADE', layout: [7,5,4,6,7,5,6], color:'#ff6b35'},\n  {name:'NEON CAVE', layout: [2,3,6,5,2,6,3], color:'#4fc3f7'},\n  {name:'SPIKE DANCE', layout: [5,5,7,1,7,5,5], color:'#00ff88'},\n  {name:'THE GAUNTLET', layout: [8,7,8,7,8,7,8], color:'#ff6b35'},\n  {name:'MYSTERY ROW', layout: [6,4,6,8,4,8,5], color:'#fbc02d'},\n  {name:'HYPER ZONE', layout: [8,8,8,7,7,8,8], color:'#00fff9'},\n  {name:'FINAL CORE', layout: [9,7,9,7,9,7,9], color:'#ff19c9'}\n];\nlet POWER_UP_TYPES = [\n  {type:'life',    label:'1UP', color:'#4fc3f7'},\n  {type:'multi',   label:'MB',  color:'#ff6b35'},\n  {type:'laser',   label:'LZR', color:'#c3ff25'},\n  {type:'slow',    label:'SLO', color:'#00ff88'},\n  {type:'magnet',  label:'MAG', color:'#00fff9'},\n  {type:'shield',  label:'SHL', color:'#ff19c9'}, // NEW SHIELD POWER-UP\n  {type:'scorex2', label:'2X',  color:'#fbc02d'},\n  {type:'bomb',    label:'BMB', color:'#fff'},\n];\nlet FALL_POWERUP_FREQ = 0.21,\n    TIMER_POWERUP_FREQ = 0.13; // prob per sec\n/***** GAME STATE *****/\nlet ctx = document.querySelector('canvas').getContext('2d');\nlet game, audio;\nlet muted = (localStorage[\"canvas_game_muted\"] === \"1\");\n/***** AUDIO ENGINE (WebAudio) *****/\nfunction MusicEngine() {\n  let ac = new(window.AudioContext||window.webkitAudioContext)();\n  let master = ac.createGain();\n  master.gain.value = (muted) ? 0 : 0.22;\n  master.connect(ac.destination);\n  let musicNodes = [];\n  let musicInt = null;\n  function playTone(freq, type, dur, gain=0.5) {\n    let o = ac.createOscillator(), g = ac.createGain();\n    o.type = type || 'sine';\n    o.frequency.value = freq;\n    g.gain.value = 0;\n    g.connect(master);\n    o.connect(g);\n    o.start();\n    g.gain.linearRampToValueAtTime(gain, ac.currentTime+0.01);\n    g.gain.linearRampToValueAtTime(0, ac.currentTime+dur);\n    o.stop(ac.currentTime+dur+0.08);\n    setTimeout(()=>{g.disconnect();o.disconnect();},(dur+0.09)*1000);\n  }\n  function sfx(name) {\n    if(muted) return;\n    if(name===\"hit\")   playTone(410+Math.random()*35, 'triangle', 0.055, 0.47);\n    if(name===\"brick\") playTone(130+Math.random()*60, 'sawtooth', 0.16, 0.5);\n    if(name===\"power\") playTone(550+Math.random()*55, 'square', 0.15, 0.49);\n    if(name===\"life\")  playTone(1560, 'square', 0.25, 0.5);\n    if(name===\"fail\")  {playTone(120, 'sine', 0.2, 0.5); setTimeout(()=>playTone(77,'sawtooth',0.24,0.4),90);}\n    if(name===\"level\") playTone(185, 'triangle', 0.47, 0.18);\n    if(name===\"bomb\")  {playTone(220, 'square', 0.21, 0.7); setTimeout(()=>playTone(68,'triangle',0.19,0.64),140);}\n    if(name===\"newhi\") playTone(900, 'square', 0.48, 0.58);\n    if(name===\"shield\") playTone(2200, 'triangle', 0.34, 0.36);\n  }\n  function startMusic(levelIx) {\n    stopMusic();\n    let root = 220 + levelIx*16;\n    let seq = [0,4,7,12,7,4,2,0];\n    let bpm = 116 + levelIx*7;\n    musicInt = setInterval(() => {\n      let beat = Math.floor(Math.random()*seq.length);\n      let f = root * Math.pow(2,seq[beat]/12);\n      let type = (beat%3===0)?'triangle':'sawtooth';\n      playTone(f, type, 0.14+levelIx*0.006, 0.34+0.06*Math.random());\n      // Add overlay bell for high levels\n      if(levelIx>5 && Math.random()<0.30) playTone(f*2.02, 'triangle', 0.11, 0.21);\n    }, 60000/bpm);\n    // Pad drone chord\n    let o = ac.createOscillator(), g = ac.createGain();\n    o.type='sine';\n    o.frequency.value = root/2;\n    g.gain.value = 0.14;\n    g.connect(master); o.connect(g);\n    o.start();\n    o.stop(ac.currentTime+300); // kill after 5m if still running\n    musicNodes=[o,g];\n  }\n  function stopMusic() {\n    if(musicInt) clearInterval(musicInt);\n    if(musicNodes.length) { musicNodes.forEach(n=>{try{n.disconnect();}catch{}}); musicNodes=[]; }\n  }\n  function muteSwitch(on) {\n    muted=on; localStorage[\"canvas_game_muted\"]=on?\"1\":\"0\";\n    master.gain.value = (muted) ? 0 : 0.22;\n  }\n  return { sfx, startMusic, stopMusic, muteSwitch };\n}\naudio = MusicEngine();\n/***** UI: MUTE BUTTON *****/\n(function() {\n  let muteBtn = document.getElementById('mute-btn');\n  let icon = document.getElementById('mute-icon');\n  function update() {\n    if(muted) { muteBtn.classList.add('muted'); icon.textContent='🔇'; }\n    else { muteBtn.classList.remove('muted'); icon.textContent='🔊'; }\n  }\n  muteBtn.onclick = () => {\n    muted = !muted;\n    audio.muteSwitch(muted);\n    update();\n  };\n  update();\n})();\n/***** SCORE/HIGH SCORE UI & INITIALS ENTRY *****/\nfunction getHighScore() {\n  let entry = localStorage['canvas_arcanoid_highscore']||'AAA 0';\n  let s = entry.split(' ');\n  return { initials: (s[0]||'AAA').slice(0,3), score: +s[1]||0 };\n}\nfunction setHighScore(initials, score) {\n  localStorage['canvas_arcanoid_highscore'] = (initials.slice(0,3).toUpperCase()+\" \"+score);\n}\nfunction promptInitials(score, cb) {\n  let d=document.getElementById('initials-prompt'),f=document.getElementById('initials-form'),i=document.getElementById('initials-input');\n  d.style.display='flex';\n  i.value=''; i.focus();\n  f.onsubmit=e=>{e.preventDefault();let x=i.value.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();if(!x)x='???';d.style.display='none';cb(x);};\n}\n/***** UTILITY *****/\nfunction randOne(arr) { return arr[Math.floor(Math.random()*arr.length)]; }\nfunction clamp(x,a,b){return Math.min(b,Math.max(a,x));}\n/***** GAME CLASSES *****/\nfunction makeGame() {\nlet g = {\n  state: 'level-intro',\n  score: 0,\n  hiscore: getHighScore(),\n  initials: getHighScore().initials,\n  lives: 3,\n  level: 0,\n  maxLevel: LEVELS.length-1,\n  paddle: { x: WIDTH/2-46, w: 92, h: 15, speed: 7, shield:false, shieldTimer:0 },\n  ball: { x: WIDTH/2, y: HEIGHT-90, vx: 4, vy: -7, r: 9, active: false },\n  balls: [],\n  bricks: [],\n  powerups: [],\n  activePower: {},\n  timers: { pSpawn: 0 },\n  combo: 0,\n  comboTimer: 0,\n  _respawning: false,\n};\n// ---- LAYOUT/LEVEL LOGIC ----\ng.setLevel = function(lvIx) {\n  this._respawning = false;\n  this.level=lvIx; this.combo=0; this.comboTimer=0; this.powerups=[]; this.activePower={};\n  let lev=LEVELS[lvIx];\n  this.bricks=[];\n  // bricks: per row, spread across width\n  let rows=lev.layout.length, brickH=27, gapY=5;\n  for(let y=0;y<rows;++y){\n    let n=lev.layout[y],tot=n*40+(n-1)*5,off=(WIDTH-tot)/2,clr=lev.color;\n    for(let i=0;i<n;++i) {\n      this.bricks.push({ x: off+i*45, y: 58+y*(brickH+gapY), w:40, h:brickH, color:clr, alive:true });\n    }\n  }\n  // Ball resets\n  this.balls=[{...this.ball,x:WIDTH/2,y:HEIGHT-90,vx:4,vy:-7,active:false,r:9}];\n  // Paddle reset position\n  this.paddle.x=WIDTH/2-46; this.paddle.shield=false; this.paddle.shieldTimer=0;\n  // Set Powerups\n  this.powerups=[]; this.timers.pSpawn=performance.now()+1200;\n  this.state = 'level-intro';\n};\ng.nextLevel = function() {\n  if(this.level < this.maxLevel) {\n    this.setLevel(this.level+1);\n    audio.sfx('level');\n    audio.startMusic(this.level);\n    this.state = 'level-intro';\n    setTimeout(()=>{this.state=\"playing\";}, 1500);\n  } else {\n    this.state = 'victory';\n    audio.stopMusic();\n  }\n};\n// ---- GAMEPLAY ----\ng.update = function(dt) {\n  if(this.state===\"level-intro\"||this.state===\"victory\"||this.state===\"gameover\") return;\n  // Paddle move (left/right arrow, A/D, or touch)\n  let movingL=window._leftPress,movingR=window._rightPress;\n  if(window._touchX!=null) {\n    let dx=window._touchX - (this.paddle.x+this.paddle.w/2);\n    this.paddle.x += clamp(dx,-this.paddle.speed*1.5,this.paddle.speed*1.5);\n  } else {\n    let dx=0;\n    if(movingL) dx-=this.paddle.speed;\n    if(movingR) dx+=this.paddle.speed;\n    this.paddle.x += dx;\n  }\n  this.paddle.x = clamp(this.paddle.x, 2, WIDTH-this.paddle.w-2);\n  // Update balls\n  for(let ball of this.balls) {\n    if(!ball.active) continue;\n    ball.x += ball.vx; ball.y += ball.vy;\n    // Wall bounce\n    if(ball.x-ball.r<0) { ball.x=ball.r; ball.vx*=-1; audio.sfx('hit'); }\n    if(ball.x+ball.r>WIDTH) { ball.x=WIDTH-ball.r; ball.vx*=-1; audio.sfx('hit'); }\n    if(ball.y-ball.r<0) { ball.y=ball.r; ball.vy*=-1; audio.sfx('hit'); }\n    // Paddle collision\n    if(ball.y+ball.r>this.paddle.y && ball.y+ball.r<this.paddle.y+15 && ball.x>this.paddle.x && ball.x<this.paddle.x+this.paddle.w && ball.vy>0) {\n      ball.vy = -Math.abs(ball.vy)*1.05;\n      ball.vx += ((ball.x-(this.paddle.x+this.paddle.w/2))/36);\n      audio.sfx('hit');\n      if(this.activePower['magnet']) { ball.active=false; ball.y=this.paddle.y-12; }\n      this.combo++;\n      this.comboTimer = 160;\n    }\n    // Shield reflect\n    if(this.paddle.shield && ball.y+ball.r>this.paddle.y+this.paddle.h && ball.y+ball.r<this.paddle.y+this.paddle.h+4 && ball.x>this.paddle.x && ball.x<this.paddle.x+this.paddle.w && ball.vy>0) {\n      ball.vy = -Math.abs(ball.vy)*1.13;\n      audio.sfx('shield');\n      this.paddle.shieldTimer = Math.max(22, this.paddle.shieldTimer-16);\n      ball.y = this.paddle.y+this.paddle.h-ball.r-2;\n    }\n    // Death\n    if(ball.y-ball.r>HEIGHT+35) {\n      ball.active=false;\n    }\n  }\n  // Remove dead balls\n  this.balls = this.balls.filter(b=>b.active||!b.active&&b.y<=HEIGHT+35);\n  // All balls gone (guard: skip if respawning or ball awaiting launch)\n  if(this.balls.filter(b=>b.active).length==0 && !this._respawning && !this.balls.some(b=>!b.active)) {\n    this._respawning = true;\n    this.lives--;\n    audio.sfx('fail');\n    if(this.lives<=0) {\n      this.state = 'gameover';\n      audio.stopMusic();\n      if(this.score>this.hiscore.score) {\n        setTimeout(()=>{ promptInitials(this.score, init=>{ setHighScore(init,this.score); this.initials=init; this.hiscore=getHighScore(); drawHud(); }); },650);\n        audio.sfx('newhi');\n      }\n    } else {\n      setTimeout(()=>{ this._respawning=false; this.balls=[{...this.ball,x:WIDTH/2,y:HEIGHT-90,vx:4,vy:-7,active:false,r:9}]; }, 1000);\n    }\n  }\n  // Powerup timers spawn\n  let now=performance.now();\n  if(now>this.timers.pSpawn) {\n    if(Math.random()<TIMER_POWERUP_FREQ) this.spawnPowerUp();\n    this.timers.pSpawn = now+1000+Math.random()*1600;\n  }\n  // Move powerups\n  for(let p of this.powerups) p.y+=p.vy;\n  // Powerup: catch\n  for(let pi=0;pi<this.powerups.length;++pi) {\n    let p=this.powerups[pi];\n    if(p.y+p.r>this.paddle.y&&p.x>this.paddle.x&&p.x<this.paddle.x+this.paddle.w&&p.y+p.r<this.paddle.y+this.paddle.h+20) {\n      this.grabPowerUp(p);\n      this.powerups[pi].collected=true;\n      audio.sfx('power');\n    }\n  }\n  this.powerups = this.powerups.filter(p=>!p.collected&&p.y-p.r<HEIGHT+35);\n  // Power timer updates\n  for(let k in this.activePower) {\n    this.activePower[k]-=dt;\n    if(this.activePower[k]<0) delete this.activePower[k];\n    if(k==='shield'&&this.activePower[k]<=0) { this.paddle.shield=false; this.paddle.shieldTimer=0; }\n  }\n  // Shield paddle effect\n  if(this.paddle.shield) {\n    this.paddle.shieldTimer -= dt;\n    if(this.paddle.shieldTimer<0) { this.paddle.shield=false; delete this.activePower['shield']; }\n  }\n  // Combo streak\n  if(this.comboTimer>0) this.comboTimer-=dt;\n  else this.combo=0;\n  // Level win\n  if(this.bricks.filter(b=>b.alive).length===0) {\n    setTimeout(()=>this.nextLevel(),850);\n    this.state='level-intro';\n  }\n};\n// ---- POWERUPS HANDLING ----\ng.spawnPowerUp = function(x,y,type) {\n  // Spawn from destroyed objects OR random\n  let px=x,py=y,typ=type,k=POWER_UP_TYPES;\n  if(!px) px=30+Math.random()*(WIDTH-60);\n  if(!py) py=150+Math.random()*140;\n  if(!typ) typ=randOne(k).type;\n  let pt=k.find(q=>q.type===typ)||randOne(k);\n  this.powerups.push({ x:px, y:py, r:17, vy:2.6, ...pt, collected:false });\n};\ng.grabPowerUp = function(p) {\n  // Activate the effect\n  if(p.type==='life') { this.lives++; audio.sfx('life'); }\n  if(p.type==='scorex2') this.activePower['scorex2']=5500;\n  if(p.type==='slow')    this.activePower['slow']=5200;\n  if(p.type==='multi') {\n    let ballsToAdd = Math.max(1, 3-Math.floor(this.balls.length/2));\n    for(let i=0;i<ballsToAdd;++i) {\n      let b={...this.ball,active:true,x:this.paddle.x+Math.random()*this.paddle.w,y:this.paddle.y-18,vx:(Math.random()*2-1)*6,vy:-7-Math.random()*2};\n      this.balls.push(b);\n    }\n  }\n  if(p.type==='laser')   this.activePower['laser']=7200;\n  if(p.type==='magnet')  this.activePower['magnet']=8500;\n  if(p.type==='bomb') {\n    for(let b of this.bricks) if(b.alive) { b.alive=false;}\n    audio.sfx('bomb');\n    this.score+=250;\n  }\n  // ---- SHIELD POWER-UP ----\n  if(p.type==='shield') {\n    this.paddle.shield=true; this.paddle.shieldTimer=5200;\n    this.activePower['shield']=5200;\n    audio.sfx('shield');\n  }\n};\nreturn g;\n}\n/***** MAIN LOOP *****/\nfunction drawHud() {\n  ctx.save(); ctx.globalAlpha=1;\n  ctx.clearRect(0,0,390,56);\n  ctx.fillStyle=\"#0a0a0a\"; ctx.fillRect(0,0,390,56);\n  ctx.font=\"bold 1.13em monospace\";\n  ctx.fillStyle=\"#00ff88\"; ctx.fillText(`SCORE `+game.score,18,28);\n  let hi=game.hiscore||getHighScore();\n  ctx.fillStyle=\"#fbc02d\"; ctx.fillText(\"HI \"+hi.initials+\" \"+hi.score,275,28);\n  ctx.fillStyle=\"#4fc3f7\"; ctx.fillText(`LVL ${game.level+1}/${LEVELS.length}`,160,28);\n  ctx.font=\"bold 1em monospace\";\n  ctx.fillStyle=\"#4fc3f7\"; ctx.fillText(`LIVES: `+game.lives,18,48);\n  // POWERUP HUD bar\n  ctx.font = 'bold 0.98em monospace';\n  let pow = Object.keys(game.activePower), x=0;\n  for(let k of pow) {\n    let p=POWER_UP_TYPES.find(pp=>pp.type===k);\n    if(!p) continue;\n    let t=game.activePower[k];\n    ctx.save();\n    ctx.globalAlpha=0.95;\n    ctx.beginPath();\n    ctx.arc(160+40*x,49,14,0,2*Math.PI);\n    ctx.fillStyle=p.color;\n    ctx.fill();\n    ctx.globalAlpha=1;\n    ctx.fillStyle=\"#182631\";\n    ctx.fillText(p.label,149+40*x,53);\n    ctx.restore();\n    x++;\n  }\n  ctx.restore();\n}\nfunction draw() {\n  ctx.clearRect(0,0,WIDTH,HEIGHT);\n  ctx.fillStyle=BG_COLORS[game.level%BG_COLORS.length];\n  ctx.fillRect(0,0,WIDTH,HEIGHT);\n  drawHud();\n  // Paddle\n  ctx.save();\n  ctx.shadowBlur=game.paddle.shield?27:11;\n  ctx.shadowColor=game.paddle.shield?\"#ff19c9\":\"#00ff88\";\n  ctx.fillStyle=game.paddle.shield?\"#e61087\":\"#00ff88\";\n  ctx.fillRect(game.paddle.x,HEIGHT-32,game.paddle.w,game.paddle.h);\n  if(game.paddle.shield) {\n    // Draw shield arc\n    ctx.beginPath();\n    ctx.arc(game.paddle.x+game.paddle.w/2, HEIGHT-18, game.paddle.w/1.25, Math.PI*0.93, Math.PI*0.07, false);\n    ctx.lineWidth=6.5; ctx.strokeStyle=\"#ff19c9\";\n    ctx.shadowBlur=30; ctx.shadowColor=\"#ff19c9\";\n    ctx.stroke();\n  }\n  ctx.restore();\n  // Bricks\n  for(let b of game.bricks) if(b.alive) {\n    ctx.save();ctx.globalAlpha=0.97;\n    ctx.shadowBlur=10;ctx.shadowColor=b.color;\n    ctx.fillStyle=b.color;\n    ctx.fillRect(b.x,b.y,b.w,b.h);\n    ctx.restore();\n  }\n  // Balls\n  for(let ball of game.balls) {\n    if(!ball.active) continue;\n    ctx.save(); ctx.globalAlpha=0.97;\n    ctx.shadowBlur=8;\n    ctx.shadowColor=\"#fff\";\n    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,2*Math.PI);\n    ctx.fillStyle='#fff';ctx.fill();\n    ctx.restore();\n  }\n  // Powerups\n  for(let p of game.powerups) {\n    ctx.save();\n    ctx.globalAlpha=0.93;\n    ctx.shadowBlur=13;\n    ctx.shadowColor=p.color;\n    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,2*Math.PI);\n    ctx.fillStyle=p.color; ctx.fill();\n    // Icon label\n    ctx.globalAlpha=1;\n    ctx.font='bold 0.92em monospace';\n    ctx.fillStyle=\"#110a33\";\n    ctx.fillText(p.label,p.x-14,p.y+5);\n    ctx.restore();\n  }\n  // Level intro/victory/over screens\n  ctx.save();\n  if(game.state==='level-intro') {\n    ctx.globalAlpha=0.92;\n    ctx.fillStyle=\"rgba(0,0,0,0.53)\";\n    ctx.fillRect(0,HEIGHT/2-70,WIDTH,105);\n    ctx.font='bold 2.1em monospace';\n    ctx.fillStyle='#00ff88';\n    ctx.textAlign='center';\n    ctx.fillText('LEVEL '+(game.level+1),WIDTH/2,HEIGHT/2-17);\n    ctx.font='bold 1.3em monospace';\n    ctx.fillStyle=\"#4fc3f7\";\n    ctx.fillText(LEVELS[game.level].name,WIDTH/2,HEIGHT/2+23);\n    ctx.textAlign='left';\n  } else if(game.state==='victory') {\n    ctx.globalAlpha=0.90;\n    ctx.fillStyle=\"#031\"\n    ctx.fillRect(18,HEIGHT/2-98,WIDTH-36,182);\n    ctx.font='bold 2.24em monospace';\n    ctx.fillStyle = '#00ff88';\n    ctx.textAlign = 'center';\n    ctx.fillText('VICTORY!', WIDTH/2, HEIGHT/2-12);\n    ctx.font = 'bold 1.15em monospace';\n    ctx.fillStyle='#4fc3f7';\n    ctx.fillText('SCORE '+game.score,WIDTH/2,HEIGHT/2+25);\n    ctx.fillText('HISCORE '+game.hiscore.initials+\" \"+game.hiscore.score,WIDTH/2,HEIGHT/2+52);\n    ctx.font='bold 0.85em monospace'; ctx.fillStyle='#00ff88'; ctx.globalAlpha=0.5+0.5*Math.sin(performance.no
