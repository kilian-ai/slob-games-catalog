{"content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Bowl Toss</title>\n<style>\nbody {\n  margin: 0;\n  background: #0a0a0a;\n}\n#main-canvas {\n  display: block;\n  margin: 0;\n  padding: 0;\n  background: #0a0a0a;\n  width: 390px;\n  height: 844px;\n  box-shadow: 0 0 32px #442d15aa inset;\n}\n#hud {\n  position: absolute;\n  left: 0; top: 0;\n  width: 390px; height: 40px;\n  z-index: 2;\n  color: #ffe7ad;\n  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  font-size: 20px;\n  letter-spacing: 1px;\n  pointer-events: none;\n  text-align: center;\n  text-shadow: 0 2px 8px #000,0 1px 0 #442d15;\n}\n</style>\n</head>\n<body>\n<canvas id=\"main-canvas\" width=\"390\" height=\"844\"></canvas>\n<div id=\"hud\"></div>\n<script>\n// Canvas-drawn sprite generator (no VFS dependency)\nfunction _makeSprite(w, h, drawFn) {\n  var c = document.createElement('canvas');\n  c.width = w; c.height = h;\n  drawFn(c.getContext('2d'), w, h);\n  return c;\n}\n\nlet assets = {};\nlet loaded = false;\n\n// Build all sprites as canvas-drawn fallbacks\nfunction preload() {\n  // Bowl — brown wooden bowl shape\n  assets.bowl = _makeSprite(184, 184, function(g, w, h) {\n    var cx = w/2, cy = h/2, r = w/2 - 4;\n    // Outer rim\n    g.beginPath();\n    g.ellipse(cx, cy+10, r, r*0.7, 0, 0, Math.PI*2);\n    var grd = g.createRadialGradient(cx-20, cy-10, r*0.1, cx, cy+10, r);\n    grd.addColorStop(0, '#c48a3f');\n    grd.addColorStop(0.6, '#8b5e2a');\n    grd.addColorStop(1, '#5a3410');\n    g.fillStyle = grd;\n    g.fill();\n    // Inner shadow (bowl cavity)\n    g.beginPath();\n    g.ellipse(cx, cy+14, r*0.72, r*0.48, 0, 0, Math.PI*2);\n    var grd2 = g.createRadialGradient(cx, cy+6, r*0.05, cx, cy+18, r*0.6);\n    grd2.addColorStop(0, '#3a1e08');\n    grd2.addColorStop(1, '#6b3a15');\n    g.fillStyle = grd2;\n    g.fill();\n    // Rim highlight\n    g.beginPath();\n    g.ellipse(cx, cy+4, r*0.9, r*0.15, 0, Math.PI, Math.PI*2);\n    g.strokeStyle = 'rgba(255,220,160,0.5)';\n    g.lineWidth = 3;\n    g.stroke();\n  });\n\n  // Coin — gold circle with shine\n  assets.coin = _makeSprite(56, 56, function(g, w, h) {\n    var cx = w/2, cy = h/2, r = w/2 - 3;\n    g.beginPath();\n    g.arc(cx, cy, r, 0, Math.PI*2);\n    var grd = g.createRadialGradient(cx-6, cy-6, 2, cx, cy, r);\n    grd.addColorStop(0, '#fff176');\n    grd.addColorStop(0.4, '#ffd740');\n    grd.addColorStop(1, '#c49000');\n    g.fillStyle = grd;\n    g.fill();\n    g.strokeStyle = '#a67c00';\n    g.lineWidth = 2;\n    g.stroke();\n    // Dollar sign\n    g.fillStyle = '#a67c00';\n    g.font = 'bold 22px sans-serif';\n    g.textAlign = 'center';\n    g.textBaseline = 'middle';\n    g.fillText('$', cx, cy+1);\n  });\n\n  // Red ball\n  assets.red = _makeSprite(64, 64, function(g, w, h) {\n    var cx = w/2, cy = h/2, r = w/2 - 3;\n    g.beginPath();\n    g.arc(cx, cy, r, 0, Math.PI*2);\n    var grd = g.createRadialGradient(cx-8, cy-8, 2, cx, cy, r);\n    grd.addColorStop(0, '#ff8a8a');\n    grd.addColorStop(0.5, '#e53935');\n    grd.addColorStop(1, '#8e0000');\n    g.fillStyle = grd;\n    g.fill();\n    // Highlight\n    g.beginPath();\n    g.arc(cx-8, cy-10, r*0.3, 0, Math.PI*2);\n    g.fillStyle = 'rgba(255,255,255,0.35)';\n    g.fill();\n  });\n\n  // Blue ball\n  assets.blue = _makeSprite(60, 60, function(g, w, h) {\n    var cx = w/2, cy = h/2, r = w/2 - 3;\n    g.beginPath();\n    g.arc(cx, cy, r, 0, Math.PI*2);\n    var grd = g.createRadialGradient(cx-7, cy-7, 2, cx, cy, r);\n    grd.addColorStop(0, '#81d4fa');\n    grd.addColorStop(0.5, '#1e88e5');\n    grd.addColorStop(1, '#0d47a1');\n    g.fillStyle = grd;\n    g.fill();\n    // Highlight\n    g.beginPath();\n    g.arc(cx-7, cy-9, r*0.28, 0, Math.PI*2);\n    g.fillStyle = 'rgba(255,255,255,0.35)';\n    g.fill();\n  });\n\n  loaded = true;\n  startGame();\n}\n\nlet canvas = document.querySelector('#main-canvas');\nlet ctx = canvas.getContext('2d');\nlet hud = document.getElementById('hud');\n\nlet W = 390, H = 844;\n\n// Game State Variables\nlet objects = [];\nlet bowl = null;\nlet score = 0;\nlet gameOver = false;\nlet dragging = null;\nlet dragOffset = {x:0, y:0};\nlet dragTrail = [];\nlet dragStartTime = 0;\n\nfunction resetGame() {\n  score = 0;\n  gameOver = false;\n  objects = [];\n  bowl = {\n    x: W/2,\n    y: H-120,\n    r: 92,\n    img: assets.bowl\n  };\n  // Tossables:\n  // 3 coins\n  for(let i=0;i<3;i++) {\n    objects.push({\n      type:'coin',\n      img:assets.coin,\n      x:80+100*i+Math.random()*25,\n      y:80+Math.random()*32,\n      r:28,\n      vx:0, vy:0, ax:0, ay:0.5,\n      grabbed:false,\n      scored:false,\n      bounce:0.55\n    });\n  }\n  // 1 red ball\n  objects.push({\n    type:'red',\n    img:assets.red,\n    x:70+Math.random()*60,\n    y:160+Math.random()*30,\n    r:32,\n    vx:0, vy:0, ax:0, ay:0.5,\n    grabbed:false,\n    scored:false,\n    bounce:0.82\n  });\n  // 2 blue balls\n  for(let i=0;i<2;i++) {\n    objects.push({\n      type:'blue',\n      img:assets.blue,\n      x:230+Math.random()*50,\n      y:160+Math.random()*45,\n      r:30,\n      vx:0, vy:0, ax:0, ay:0.5,\n      grabbed:false,\n      scored:false,\n      bounce:0.8\n    });\n  }\n}\n\nfunction drawBg() {\n  ctx.clearRect(0,0,W,H);\n  // Dark bg, slight warm highlight at bowl base\n  let grd = ctx.createRadialGradient(bowl.x, bowl.y+30,90, bowl.x, bowl.y+90,260);\n  grd.addColorStop(0, \"#55381866\");\n  grd.addColorStop(1, \"#0a0a0a\");\n  ctx.fillStyle = grd;\n  ctx.fillRect(0,0,W,H);\n}\n\nfunction drawBowl() {\n  let b = bowl;\n  ctx.save();\n  ctx.globalAlpha = 1;\n  ctx.drawImage(b.img, b.x-b.r, b.y-b.r, b.r*2, b.r*2);\n  ctx.restore();\n}\n\nfunction drawObjects() {\n  for(let o of objects) {\n    if(o.scored) continue;\n    ctx.save();\n    ctx.globalAlpha = 1;\n    ctx.drawImage(o.img, o.x-o.r, o.y-o.r, o.r*2, o.r*2);\n    if(o.grabbed && dragTrail.length>1) {\n      ctx.strokeStyle = o.type==='coin' ? '#ffec57' : (o.type==='red'? '#ff5a7a' : '#4fc3f7');\n      ctx.lineWidth = 6;\n      ctx.beginPath();\n      ctx.moveTo(o.x, o.y);\n      for(let p of dragTrail) ctx.lineTo(p.x, p.y);\n      ctx.stroke();\n    }\n    ctx.restore();\n  }\n}\n\nfunction drawScore() {\n  hud.innerHTML = `<span style='color:#ffe77c;'>SCORE: ${score}</span>`;\n}\n\nfunction objectInBowl(o) {\n  // check center in bowl area, and object is falling \"down\" or stopped\n  let dx = o.x-bowl.x, dy = o.y-bowl.y;\n  let r = bowl.r-18; // only score if mostly inside, with margin\n  return (!o.scored && (dx*dx+dy*dy < (r-o.r)*(r-o.r)) && o.vy>1 && o.y<bowl.y+o.r+8);\n}\n\nfunction updatePhysics() {\n  for(let o of objects) {\n    if(o.scored) continue;\n    if(o.grabbed) {\n      o.vx = o.vy = 0;\n      continue;\n    }\n    // Gravity\n    o.vy += o.ay;\n    o.vx += o.ax;\n    // Air friction\n    o.vx *= 0.993;\n    o.vy *= 0.995;\n    o.x += o.vx;\n    o.y += o.vy;\n    // Walls\n    if(o.x-o.r<0) {\n      o.x=o.r; o.vx*=-o.bounce; o.vy*=0.96;\n    }\n    if(o.x+o.r>W) {\n      o.x=W-o.r; o.vx*=-o.bounce; o.vy*=0.96;\n    }\n    // Floor\n    if(o.y+o.r>H) {\n      o.y=H-o.r; o.vy*=-o.bounce; o.vx*=0.99; // Nice bounce\n      if(Math.abs(o.vy)<2) o.vy=0;\n    }\n    // Stop tiny velocities\n    if(Math.abs(o.vx)<0.08) o.vx=0;\n    if(Math.abs(o.vy)<0.08) o.vy=0;\n    // Bowl catch\n    if(objectInBowl(o)) {\n      o.scored = true;\n      score += (o.type==='coin'?25: (o.type==='red'?40:32));\n      // gentle settle to bowl\n      o.x=bowl.x+(Math.random()-0.5)*42;\n      o.y=bowl.y+(Math.random()-0.5)*28;\n      o.vx=o.vy=0;\n      // SFX (stub)\n      bounceSound(o);\n    }\n  }\n}\n\nfunction bounceSound(o) {\n  // Satisfying chime for landing in bowl\n  let ctxA = new window.AudioContext();\n  let osc = ctxA.createOscillator();\n  let gain = ctxA.createGain();\n  osc.type = o.type === 'coin' ? 'triangle' : (o.type==='red'?'sine':'square');\n  osc.frequency.value = o.type==='coin' ? 890 : (o.type==='red'?630:485);\n  gain.gain.setValueAtTime(0.22, ctxA.currentTime);\n  gain.gain.linearRampToValueAtTime(0, ctxA.currentTime+0.22);\n  osc.connect(gain).connect(ctxA.destination);\n  osc.start();\n  osc.stop(ctxA.currentTime+0.23);\n  setTimeout(() => ctxA.close(), 300);\n}\n\nfunction checkAllScored() {\n  gameOver = objects.every(o=>o.scored);\n  if(gameOver) {\n    setTimeout(()=>{\n      hud.innerHTML += \"<br><span style='font-size:21px; color:#00ff88; text-shadow:0 1px 6px #008844;'>All done! Tap to reset.</span>\";\n    },600);\n  }\n}\n\nfunction loop() {\n  drawBg();\n  drawBowl();\n  drawObjects();\n  drawScore();\n  updatePhysics();\n  checkAllScored();\n  window.__canvasAnimId = requestAnimationFrame(loop);\n}\n\n// Drag&Fling controls: Touch/Mouse\nfunction pointerDown(ev) {\n  if(gameOver) {\n    resetGame();\n    return;\n  }\n  let pos = getPointer(ev);\n  for(let o of objects) {\n    if(o.scored) continue;\n    let dx = o.x-pos.x, dy = o.y-pos.y;\n    if(dx*dx+dy*dy < o.r*o.r+10){\n      o.grabbed=true;\n      dragging = o;\n      dragOffset = {x:pos.x-o.x, y:pos.y-o.y};\n      dragTrail = [{x:pos.x,y:pos.y}];\n      dragStartTime = Date.now();\n      break;\n    }\n  }\n}\nfunction pointerMove(ev) {\n  if(!dragging) return;\n  let pos = getPointer(ev);\n  dragging.x = pos.x-dragOffset.x;\n  dragging.y = pos.y-dragOffset.y;\n  dragTrail.unshift({x:pos.x,y:pos.y});\n  if(dragTrail.length>18) dragTrail.length=18;\n}\nfunction pointerUp(ev) {\n  if(!dragging) return;\n  let pos = getPointer(ev);\n  if(dragTrail.length>2) {\n    // Velocity = backward vector of finger\n    let pre = dragTrail[8] || dragTrail[dragTrail.length-1];\n    dragging.vx = (dragging.x-pre.x)*0.23;\n    dragging.vy = (dragging.y-pre.y)*0.22;\n    // Clamp velocity\n    dragging.vx = Math.max(-19,Math.min(19,dragging.vx));\n    dragging.vy = Math.max(-17,Math.min(17,dragging.vy));\n  } else {\n    dragging.vx = 0;\n    dragging.vy = 0;\n  }\n  dragging.grabbed = false;\n  dragging = null;\n  dragTrail = [];\n}\nfunction getPointer(ev) {\n  let rect = canvas.getBoundingClientRect();\n  if(ev.touches) {\n    return {\n      x: (ev.touches[0].clientX-rect.left) / rect.width * W,\n      y: (ev.touches[0].clientY-rect.top) / rect.height * H\n    };\n  } else {\n    return {\n      x: (ev.clientX-rect.left) / rect.width * W,\n      y: (ev.clientY-rect.top) / rect.height * H\n    };\n  }\n}\n\ncanvas.ontouchstart = pointerDown;\ncanvas.onmousedown = pointerDown;\ncanvas.ontouchmove = pointerMove;\ncanvas.onmousemove = function(e){if(e.buttons===1)pointerMove(e);};\ncanvas.ontouchend = pointerUp;\ncanvas.onmouseup = pointerUp;\ncanvas.onmouseleave = pointerUp;\n\nif(window.__canvasAnimId) cancelAnimationFrame(window.__canvasAnimId);\npreload(); // Async load, then startGame\n\nfunction startGame() {\n  resetGame();\n  window.__canvasAnimId = requestAnimationFrame(loop);\n}\n</script>\n</body>\n</html>\n<!-- resource-sync-trigger -->","created":"2026-04-17T03:51:45Z","game_key":"community/150b527c38a0a26e","id":"community__150b527c38a0a26e-260417035145-1","name":"Bowl Toss","resources":{},"version":""}
