{"content":"<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Blast Zone!</title>\n  <style>\n    html, body {\n      width: 390px;\n      height: 844px;\n      background: #0a0a0a;\n      margin: 0;\n      padding: 0;\n      overflow: hidden;\n    }\n    #mute-btn {\n      position: absolute;\n      top: 10px;\n      right: 14px;\n      z-index: 10;\n      background: rgba(34,34,34,0.86);\n      color: #00ff88;\n      border: 2px solid #4fc3f7;\n      border-radius: 12px;\n      padding: 6px 12px;\n      font-size: 1.1em;\n      font-family: 'Segoe UI', Arial, sans-serif;\n      cursor: pointer;\n      user-select: none;\n      transition: background 0.15s, color 0.15s;\n    }\n    #mute-btn.muted {\n      color: #ff6b35;\n      background: rgba(35,35,35,0.42);\n    }\n    #initials-entry-bg {\n      position: absolute;\n      left: 0; right: 0; top: 0; bottom: 0;\n      background: rgba(10,10,10,0.92);\n      z-index: 32;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      backdrop-filter: blur(2px);\n    }\n    #initials-entry-box {\n      background: #161616;\n      border: 2px solid #00ff88;\n      border-radius: 14px;\n      padding: 32px 26px 26px 26px;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      box-shadow: 0 6px 32px #000b;\n    }\n    #initials-entry-box label {\n      color: #4fc3f7;\n      font-size: 1.33em;\n      font-family: 'Segoe UI', Arial, sans-serif;\n      margin-bottom: 13px;\n      letter-spacing: 1.5px;\n    }\n    #initials-input {\n      font-size: 2em;\n      width: 90px;\n      text-transform: uppercase;\n      text-align: center;\n      padding: 6px 6px;\n      border-radius: 10px;\n      border: 2px solid #ff6b35;\n      outline: none;\n      background: #222;\n      color: #00ff88;\n      margin-bottom: 16px;\n      letter-spacing: 7px;\n      font-family: 'Segoe UI', Arial, monospace;\n    }\n    #initials-ok-btn {\n      font-size: 1.25em;\n      background: #ff6b35;\n      color: white;\n      border: none;\n      border-radius: 8px;\n      padding: 7px 24px;\n      cursor: pointer;\n      font-weight: bold;\n      outline: none;\n      box-shadow: 0 2px 11px #000a;\n    }\n  </style>\n</head>\n<body>\n  <button id=\"mute-btn\" title=\"Mute/Unmute Sound\">🔊</button>\n  <div id=\"initials-entry-bg\" style=\"display:none\">\n    <div id=\"initials-entry-box\">\n      <label>NEW HIGH SCORE!<br>ENTER YOUR INITIALS</label>\n      <input id=\"initials-input\" type=\"text\" maxlength=\"3\" autocomplete=\"off\" autofocus />\n      <button id=\"initials-ok-btn\">OK</button>\n    </div>\n  </div>\n  <canvas width=\"390\" height=\"844\" style=\"width:390px;height:844px;display:block;outline:none;margin:0 auto;background:#0a0a0a;\"></canvas>\n<script>\n// --- GAME STATE ---\nlet canvas = document.querySelector('canvas');\nlet ctx = canvas.getContext('2d');\nlet W = 390, H = 844;\nlet keys = {};\nlet started = false, gameOver = false, showLevelIntro = false, showVictory = false;\nlet initialsPrompt = false;\nlet initials = '';\nlet score = 0, highScore = 0, highInitials = 'AAA';\nlet level = 1, maxLevel = 8;\nlet lives = 3;\nlet player, balls, bricks, powerUps, explosions, enemies, hazards;\nlet HUD={}, music, SFX={}, audioMute = false;\nlet lastPowerupTime = 0;\nlet levelIntroTimer = 0;\nlet comboStreak = 0, comboTimer = 0;\nlet activePowerUps = [];\nlet levelThemes = ['#0a0a0a', '#11161c', '#212f23', '#2a1f2e', '#180c0e', '#221c10', '#162726', '#273049'];\nlet levelNames = ['BLAST-OFF', 'TUNNEL RUSH', 'CRYSTAL PIT', 'INFERNO', 'GRAVITY WELL', 'ECLIPSE MAZE', 'GHOSTLY', 'OVERLOAD!'];\nlet showBlastOff = false;\nlet blastOffCallback = null;\nlet blastOffTimeout = null;\n// --- AUDIO SETUP ---\nlet ac = new (window.AudioContext || window.webkitAudioContext)(),\n    masterGain = ac.createGain();\nmasterGain.gain.value = 0.22;\nmasterGain.connect(ac.destination);\n// No autoplay until user interacts\nlet synthReady = false;\nfunction resumeAudio() {\n  if(!synthReady) ac.resume&&ac.resume();\n  synthReady = true;\n}\n// --- UTILS ---\nfunction rand(a,b) { return Math.random()*(b-a)+a; }\nfunction pick(arr) { return arr[(Math.random()*arr.length)|0]; }\nfunction clamp(x,a,b) { return Math.max(a,Math.min(b,x)); }\nfunction now() { return performance.now(); }\nfunction lerp(a,b,t) { return a+(b-a)*t; }\n// Score & Highscore\nfunction loadHi() {\n  let s = localStorage.getItem('bz_hi_s');\n  let n = localStorage.getItem('bz_hi_n');\n  highScore = s ? +s : 0;\n  highInitials = n ? n : 'AAA';\n}\nfunction saveHi() {\n  localStorage.setItem('bz_hi_s',String(highScore));\n  localStorage.setItem('bz_hi_n',highInitials);\n}\n// --- GAME OBJECTS ---\nfunction resetGame() {\n  score = 0;\n  level = 1;\n  lives = 3;\n  comboStreak = 0; comboTimer = 0;\n  activePowerUps.length = 0;\n  setupLevel(level);\n  started = true; gameOver = false; showLevelIntro = true; showVictory=false;\n  levelIntroTimer = now();\n  showBlastOff = true;\n  if (blastOffTimeout) clearTimeout(blastOffTimeout);\n  blastOffCallback = function() {\n    showLevelIntro = false;\n    showBlastOff = false;\n    musicLoop(level);\n    gameLoop._last = performance.now();\n    window.__canvasAnimId = requestAnimationFrame(gameLoop);\n  };\n  blastOffTimeout = setTimeout(() => {\n    if (typeof blastOffCallback === 'function') {\n      blastOffCallback();\n      blastOffCallback = null;\n    }\n  }, 1900);\n}\nfunction setupLevel(lv) {\n  player = {\n    x: W/2, y: H-56,\n    w: 74, h: 22,\n    color: '#00ff88',\n    vx: 0,\n    speed: 8,\n    shield: 0, // ms\n    invincible: 0,\n    magnet: 0\n  };\n  balls = [{\n    x: W/2, y: H-84, vx: rand(-4,4), vy: -8, r: 11, color: '#4fc3f7', ghost: 0, fire: 0,\n    lastHit: null\n  }];\n  explosions = [];\n  enemies = [];\n  hazards = [];\n  powerUps = [];\n  // Each level gets unique layout/hazards\n  let rows = lerp(5,12, (lv-1)/(maxLevel-1))|0;\n  let cols = lerp(7,11, (lv-1)/(maxLevel-1))|0;\n  let brk = [];\n  let topGap = 83 + (lv-1)*10;\n  let brickW = (W-20)/cols;\n  for(let r=0; r<rows; ++r) {\n    let arr = [];\n    for(let c=0; c<cols; ++c) {\n      // Holes or hazards for certain lvls\n      if((lv===2 && r>=2 && c%4===2) || (lv===3 && r%2===1 && c%2===1)) { arr.push(null); continue; }\n      let hp = lv<3?1: Math.ceil(rand(1,3+(lv/2)));\n      arr.push({\n        x: 12 + c*brickW,\n        y: topGap + r*32,\n        w: brickW-7, h: 23,\n        hp: hp,\n        color: (lv%2==0 ? '#4fc3f7':'#ff6b35'),\n        bonus: Math.random()>.68 ? 1 : 0 // extra power chance\n      });\n    }\n    brk.push(arr);\n  }\n  // Hazards/enemies for certain levels\n  if(lv>=3) enemies.push({x:W/2, y:topGap+rows*32+24, vx:2+lv, w:44, h:24, hp: 1+lv*1.5, color:'#ff6b35', dir:1, t:now()});\n  if(lv>=5) hazards.push({x:40, y: topGap+rows*32+50, vy:2.4+0.23*lv, r:21+lv, t:now()});\n  if(lv>=6) hazards.push({x:W-60, y: topGap+rows*32+80, vy:-2.0-0.2*lv, r:18+lv, t:now()});\n  bricks = brk;\n  lastPowerupTime = now() + 1500;\n  activePowerUps.length = 0;\n  comboStreak = 0;\n}\n// --- POWER-UP LOGIC ---\nlet POWERUPS = [\n  { name: '1UP', color:'#00ff88', label:'1UP', act() { lives++; sfx('1up'); } },\n  { name: 'SHIELD', color:'#4fc3f7', label:'SHD', act() { player.shield=6000; sfx('shield'); addPU('SHIELD',6000,'#4fc3f7'); } },\n  { name: 'SPEED', color:'#ffec38', label:'SPD', act() { player.speed+=5; setTimeout(()=>{player.speed-=5;},7000); sfx('spd'); addPU('SPEED',7000,'#ffec38'); } },\n  { name: 'INVINC', color:'#be89f4', label:'INF', act() { player.invincible=4200; sfx('inv'); addPU('INVINC',4200,'#be89f4'); } },\n  { name: 'MULTI', color:'#fa6b8b', label:'MBL', act() { launchExtraBall(); sfx('multi'); addPU('MULTIBALL',7000,'#fa6b8b'); } },\n  { name: 'BOMB', color:'#ff6b35', label:'BOM', act() { clearBricks(); sfx('bomb'); addPU('BOMB',1000,'#ff6b35'); } },\n  { name: 'SLOW', color:'#7ddff2', label:'SLW', act() { slowMotion(5700); sfx('slow'); addPU('SLOW',5700,'#7ddff2'); } },\n  { name: 'LASER', color:'#caff15', label:'LSR', act() { player.laser=(now()+6000); sfx('laser'); addPU('LASER',6000,'#caff15'); } },\n  { name: 'MAGNET', color:'#f24d97', label:'MAG', act() { player.magnet=7000; sfx('mag'); addPU('MAGNET',7000,'#f24d97'); } },\n  { name: '2X', color:'#abff2f', label:'2X', act() { addPU('2X',7700,'#abff2f'); sfx('2x'); } },\n  { name: 'GHOST', color:'#f7f4e1', label:'GHO', act() { addPU('GHOST',6700,'#f7f4e1'); sfx('ghost'); balls.forEach(b=>b.ghost=6700); } },\n  { name: 'FIRE', color:'#ff2d2d', label:'FIR', act() { addPU('FIREBALL',6000,'#ff2d2d'); sfx('fire'); balls.forEach(b=>b.fire=6000); } }\n];\nfunction addPU(name,dur,color) {\n  activePowerUps.push({name:name, until:now()+dur, color});\n}\nfunction launchExtraBall() {\n  if(balls.length>6) return;\n  balls.push({x:player.x+player.w/2, y:player.y-17, vx:rand(-5,5), vy:-8-rand(0,2), r:11, color:'#4fc3f7', ghost:0, fire:0});\n}\nfunction clearBricks() {\n  // Remove half of visible bricks\n  let n=0;\n  for(let r=0;r<bricks.length;++r)\n    for(let c=0;c<bricks[r].length;++c) {\n      let b=bricks[r][c];\n      if(b && b.hp>0 && Math.random()<.48) { bricks[r][c]=null; n++; score+=7; }\n    }\n  explosions.push({x:W/2,y:H/2,r:44,col:'#ff6b35',t:now()});\n}\nfunction slowMotion(dur) {\n  for(let b of balls) { b.vx*=0.55; b.vy*=0.62; }\n  setTimeout(()=>{for(let b of balls) { b.vx*=1.7; b.vy*=1.4; }},dur);\n}\n\nfunction spawnPowerup(x,y,special) {\n  let pool = special ? POWERUPS.concat(POWERUPS).slice(0,POWERUPS.length+2) : POWERUPS;\n  let p = pick(pool);\n  powerUps.push({\n    x: x, y: y, vy: rand(2.1,4.2),\n    color: p.color, label: p.label, act: p.act, t:now(), name:p.name\n  });\n}\n\n// --- SOUND ---\nfunction sfx(type) {\n  if(audioMute) return;\n  let g = ac.createGain();\n  let o = ac.createOscillator();\n  let env = ac.createGain();\n  g.connect(masterGain);\n  env.connect(g);\n  let nowT = ac.currentTime;\n  let v=1;\n  let f=400,f2=1800,d=0.17,w='square';\n  if(type===\"hit\")  { f=470; f2=570; d=0.08; w='triangle';}\n  else if(type===\"brick\") { f=340; f2=1600; d=0.13; w='sine'; }\n  else if(type===\"power\") { f=330; f2=900; d=0.18; w='triangle'; }\n  else if(type===\"bomb\")  { f=180; f2=70; d=0.33; w='square'; v=1.2; }\n  else if(type===\"1up\")   { f=910; f2=1220; d=0.23; w='triangle'; }\n  else if(type===\"laser\") { f=1220;f2=700; d=0.08; w='sine'; v=1.1; }\n  else if(type===\"spd\")   { f=670; f2=300; d=0.11; w='square'; }\n  else if(type===\"inv\")   { f=1400;f2=140; d=0.16; w='sawtooth';v=1.2;}\n  else if(type===\"shield\"){ f=410; f2=820; d=0.16; w='triangle'; }\n  else if(type===\"ghost\") { f=123; f2=232; d=0.14; w='sine';}\n  else if(type===\"2x\")    { f=800; f2=400; d=0.13; w='sawtooth';}\n  else if(type===\"fire\")  { f=1700;f2=210; d=0.22; w='square'; }\n  else if(type===\"slow\")  { f=172; f2=72;  d=0.15; w='triangle';}\n  else if(type===\"gameover\"){f=117;f2=40;d=0.77;w='triangle';}\n  else if(type===\"level\") {f=180+rand(-10,20);f2=580+rand(-12,9);d=0.32;w='triangle';}\n  else if(type===\"victory\"){f=860;f2=1960;d=0.52;w='triangle';}\n  else if(type===\"mag\")   {f=240;f2=820;d=0.2;w='triangle';}\n  else if(type===\"brick2\"){f=910;f2=530;d=0.22;w='square';}\n  o.frequency.value=f;\n  o.type=w;\n  o.connect(env);\n  env.gain.value=0.001;\n  env.gain.setValueAtTime(0.001,nowT);\n  env.gain.linearRampToValueAtTime(v,nowT+0.007);\n  env.gain.linearRampToValueAtTime(0.001,nowT+d);\n  o.frequency.setValueAtTime(f,nowT);\n  o.frequency.linearRampToValueAtTime(f2,nowT+d*0.88);\n  o.start(nowT);\n  o.stop(nowT+d);\n  setTimeout(()=>{o.disconnect();env.disconnect();g.disconnect()},d*1000+50);\n}\n// --- MUSIC ---\nlet _musicSeq, _musicLvl = -1, _musicMute = false, _musicT = 0, _musicDur = 0, _musicSeqInt = null;\nfunction musicLoop(lv) {\n  if(audioMute||_musicMute) return;\n  if(_musicLvl!==lv) {\n    _musicLvl=lv;_musicSeq=null;\n    if(_musicSeqInt) clearTimeout(_musicSeqInt);\n    _musicSeq = [];\n    // Each level: notes/x instrument\n    let nt=[220,330,440,392,294,740,554,330,262];\n    let sy=[['square','triangle'],['triangle','triangle'],['triangle','sine'],['sine','triangle'],['square','square']];\n    let base=nt[(lv-1)%nt.length];\n    for(let i=0;i<12;i++) {\n      _musicSeq.push({f:base+nt[i%nt.length]*0.43+(lv*18),t:0.17,w:pick(sy[(lv-1)%sy.length])});\n    }\n  }\n  let k=0;\n  function playNote(){\n    if(audioMute||_musicMute) return;\n    let n = _musicSeq[k%_musicSeq.length];\n    let g = ac.createGain(); g.gain.value=0.16; g.connect(masterGain);\n    let o = ac.createOscillator(); o.type=n.w[+(k%2)]; o.frequency.value=n.f;\n    o.connect(g);\n    o.start(ac.currentTime);\n    o.stop(ac.currentTime + n.t);\n    setTimeout(()=>{o.disconnect();g.disconnect();},n.t*1000+22);\n    k++;\n    if(!showLevelIntro && !showBlastOff && started && !gameOver && !showVictory) {\n      _musicSeqInt = setTimeout(playNote,180-lv*6+rand(-9,8));\n    }\n  }\n  if(!showLevelIntro && !showBlastOff && started && !gameOver && !showVictory) playNote();\n}\n// --- DRAW ---\nfunction draw() {\n  // Level background\n  ctx.fillStyle=levelThemes[(level-1)%levelThemes.length]||'#191929';\n  ctx.fillRect(0,0,W,H);\n  // Blast Off transition\n  if (showBlastOff) {\n    ctx.save();\n    ctx.globalAlpha=1.0;\n    ctx.fillStyle=\"#0a0a0a\";\n    ctx.fillRect(0,0,W,H);\n    ctx.textAlign='center';\n    ctx.font='bold 2.42em Segoe UI,Arial';\n    ctx.fillStyle='#ff6b35';\n    ctx.fillText('BLAST OFF!', W/2, H/2-24);\n    ctx.font='1.12em Segoe UI';\n    ctx.fillStyle='#4fc3f7';\n    ctx.fillText('Get Ready...', W/2, H/2+30);\n    ctx.restore();\n    return;\n  }\n  // Title\n  if(!started && !gameOver) {\n    ctx.textAlign='center'; ctx.fillStyle='#fff';\n    ctx.font='bold 2.0em Segoe UI,Arial';\n    ctx.fillText('BLAST ZONE', W/2, 117);\n    ctx.font='1.38em Segoe UI';\n    ctx.fillStyle='#00ff88';\n    ctx.fillText('Press [SPACE] or Tap to Start', W/2, 158);\n    ctx.font='bold 1.1em monospace';\n    ctx.fillStyle='#4fc3f7';\n    ctx.fillText('High: '+highInitials+' '+highScore, W/2, 205);\n    return;\n  }\n  // Victory\n  if(showVictory) {\n    ctx.textAlign='center';ctx.font='2.4em Segoe UI';\n    ctx.fillStyle='#00ff88';\n    ctx.fillText('VICTORY! 🎉',W/2,150);\n    ctx.font='1.2em Segoe UI';ctx.fillStyle='#fff';\n    ctx.fillText('Final Score: '+score, W/2,210);\n    ctx.fillStyle='#4fc3f7'; ctx.font='1.05em Segoe UI';\n    ctx.fillText('High: '+highInitials+' '+highScore, W/2, 240);\n    ctx.font='0.94em Segoe UI'; ctx.fillStyle='#ff6b35';\n    ctx.fillText('Tap to restart!',W/2,295);\n    return;\n  }\n  // Level Up intro\n  if(showLevelIntro) {\n    ctx.textAlign='center';\n    ctx.font='2.1em Segoe UI';\n    ctx.fillStyle='#ff6b35';\n    ctx.fillText('LEVEL '+level,W/2,122);\n    ctx.font='1.4em Segoe UI';\n    ctx.fillStyle='#4fc3f7';\n    ctx.fillText(levelNames[level-1]||'', W/2, 165);\n    return;\n  }\n  // Bricks\n  for(let r=0; r<bricks.length; ++r)\n    for(let c=0; c<bricks[r].length; ++c) {\n      let b = bricks[r][c];\n      if(!b) continue;\n      ctx.fillStyle = b.color;\n      ctx.fillRect(b.x, b.y, b.w, b.h);\n      if(b.hp>1) {\n        ctx.font = 'bold 1.1em monospace';\n        ctx.fillStyle='#fff';\n        ctx.fillText(b.hp, b.x+b.w/2, b.y+b.h/2+6);\n      }\n    }\n  // Enemies\n  for(let e of enemies) {\n    ctx.save();\n    ctx.globalAlpha=0.85;\n    ctx.strokeStyle='#fff';ctx.fillStyle=e.color;\n    ctx.beginPath();ctx.ellipse(e.x,e.y,e.w/2,e.h/2,0,0,7);\n    ctx.fill(); ctx.stroke();\n    ctx.restore();\n  }\n  // Hazards\n  for(let h of hazards) {\n    ctx.save();ctx.globalAlpha=.63;ctx.strokeStyle='#ff6b35';ctx.fillStyle='#000';\n    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);\n    ctx.fill();ctx.stroke();ctx.restore();\n    ctx.beginPath();ctx.moveTo(h.x,h.y);\n    ctx.lineTo(h.x,h.y-h.r-7+Math.sin(now()/99+h.x)*9);\n    ctx.strokeStyle='#fa6b8b';ctx.stroke();\n  }\n  // Powerups\n  for(let p of powerUps) {\n    ctx.save();\n    ctx.globalAlpha=0.88;\n    ctx.beginPath();\n    ctx.arc(p.x,p.y,19,0,7);\n    ctx.fillStyle=p.color;\n    ctx.fill();\n    ctx.font='bold 1.1em monospace';\n    ctx.textAlign='center';ctx.fillStyle='#222';\n    ctx.fillText(p.label, p.x, p.y+6);\n    ctx.restore();\n  }\n  // Explosions\n  for(let ex of explosions) {\n    let dt=(now()-ex.t)/340; if(dt>1) continue;\n    ctx.globalAlpha=lerp(0.88,0,dt);\n    ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r*lerp(1,1.33,dt),0,7);\n    ctx.fillStyle=ex.col;\n    ctx.fill();\n    ctx.globalAlpha=1.0;\n  }\n  // Balls\n  for(let b of balls) {\n    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);\n    ctx.fillStyle = b.fire ? '#ff6b35' : b.ghost?'#f7f4e1':b.color;\n    ctx.shadowColor = b.fire? '#ff6b35':b.ghost?'#fff':b.color;\n    ctx.shadowBlur = b.fire||b.ghost?14:5;\n    ctx.fill();ctx.shadowBlur=0;\n  }\n  // Paddle\n  ctx.fillStyle=player.color;\n  ctx.fillRect(player.x, player.y, player.w, player.h);\n  if(player.shield>0) {\n    ctx.save();ctx.beginPath();ctx.arc(player.x+player.w/2, player.y+player.h/2, player.w*0.57, Math.PI, 0);\n    ctx.lineWidth=5;ctx.strokeStyle='#4fc3f7';ctx.globalAlpha=0.87;\n    ctx.stroke();ctx.restore();\n  }\n  if(player.magnet>0) {\n    ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,player.w*0.31,0,7);\n    ctx.strokeStyle='#f24d97';ctx.lineWidth=3;ctx.stroke();\n  }\n  if(player.invincible>0) {\n    ctx.save();ctx.globalAlpha=0.33;\n    ctx.fillStyle='#be89f4';ctx.fillRect(player.x-7,player.y-7,player.w+14,player.h+14);\n    ctx.restore();\n  }\n  // LASERS!\n  if(player.laser && player.laser > now()) {\n    ctx.strokeStyle='#caff15'; ctx.lineWidth=3.9;\n    ctx.beginPath(); ctx.moveTo(player.x+player.w/2,player.y);\n    ctx.lineTo(player.x+player.w/2,0);\n    ctx.stroke();\n  }\n  // HUD: lives/score/level/hi\n  ctx.textAlign='left';\n  ctx.font='bold 1.25em Segoe UI';\n  ctx.fillStyle='#fff';\n  ctx.fillText('SCORE '+score, 11,29);\n  ctx.fillStyle='#00ff88';\n  ctx.fillText('❤ '+lives, 11, 54);\n  ctx.fillStyle='#ff6b35';\n  ctx.fillText('LEVEL '+level, 147, 29);\n  ctx.fillStyle='#4fc3f7';\n  ctx.fillText('HI '+highInitials+' '+highScore, 219,54);\n  // Combo\n  if(comboStreak>=2) {\n    ctx.font='bold 1.13em Segoe UI'; ctx.textAlign='center';\n    ctx.fillStyle='#fa6b8b';\n    ctx.fillText('COMBO x'+comboStreak,W/2,72);\n  }\n  // Active powerups HUD\n  let i=0, xPos=8;\n  for(let pu of activePowerUps) {\n    let timeLeft = Math.max(0, (pu.until-now())/1000);\n    ctx.fillStyle=pu.color;\n    ctx.globalAlpha=0.81;\n    ctx.fillRect(xPos, H-28, 22, 22);\n    ctx.globalAlpha=1.0;\n    ctx.font='bold 0.93em monospace';\n    ctx.fillStyle='#181818';\n    ctx.textAlign='center';\n    ctx.fillText(pu.name.substring(0,3), xPos+11, H-13);\n    ctx.font='0.7em monospace';ctx.fillStyle='#fff';\n    ctx.fillText(String(Math.round(timeLeft)), xPos+11, H-3);\n    xPos += 33;\n    i++;\n  }\n}\n// --- GAME LOOP ---\nfunction update(dt) {\n  // Powerup timer spawn\n  if(!showLevelIntro && !showBlastOff && !gameOver && !showVictory && now()-lastPowerupTime>rand(9400,14500)) {\n    spawnPowerup(rand(42,W-42),rand(110,H-220));\n    lastPowerupTime = now();\n  }\n  // Active powerups expiring\n  for(let i=activePowerUps.length-1; i>=0; --i) {\n    if(activePowerUps[i].until < now())\n      activePowerUps.splice(i,1);\n  }\n  // Powerup effects\n  let pnames=activePowerUps.map(p=>p.name);\n  // Magnetic effect\n  if(pnames.includes('MAGNET')) {\n    for(let b of balls) {\n      if(Math.abs((player.x+player.w/2)-b.x)<45 && b.y>H-160 && b.y<H-40 ) {\n        b.x+=(player.x+player.w/2-b.x)*0.07;\n      }\n    }\n  }\n  // 2x multiplier\n  let mult = pnames.includes('2X') ? 2 : 1;\n  for(let i=0; i<balls.length; ++i) {\n    let b = balls[i];\n    // Ball step\n    b.x+=b.vx; b.y+=b.vy;\n    // Wall\n    if(b.x-b.r<0) { b.x=b.r; b.vx*=-1; sfx('hit');}\n    if(b.x+b.r>W) { b.x=W-b.r; b.vx*=-1; sfx('hit');}\n    if(b.y-b.r<0) { b.y=b.r; b.vy*=-1; sfx('hit');}\n    // Paddle\n    if(b.y+b.r>=player.y && b.y-b.r<player.y+player.h && b.x>player.x && b.x<player.x+player.w) {\n      b.y=player.y-b.r; b.vy*=-1; sfx('hit');\n      // Magnet (stick for moment)\n      if(pnames.includes('MAGNET')) {b.vy*=-.75;}\n      // Boost on fast paddle hit\n      let px=((b.x-player.x)/player.w-0.5)*2.4; b.vx+=px;\n      b.lastHit=now();\n    }\n    // Out of bounds\n    if(b.y-b.r>H+24) {\n      balls.splice(i,1); i--;\n      continue;\n    }\n    // Bricks\n    for(let r=0;r<bricks.length;++r) for(let c=0;c<bricks[r].length;++c) {\n      let brick=bricks[r][c]; if(!brick||brick.hp<=0) continue;\n      if(b.x>b.x-b.r && b.x< brick.x+brick.w+1 && b.y>b.y-b.r\n      && b.x > brick.x && b.x < brick.x+brick.w && b.y > brick.y && b.y < brick.y+brick.h+1) {\n        if(!b.ghost) b.vy*=-1;\n        // Fireball pierces\n        if(b.fire) { brick.hp=0; score+=7*mult; sfx('brick2'); }\n        else { brick.hp--; score+=3*mult; comboStreak++;comboTimer=now(); sfx('brick'); }\n        if(brick.hp<=0) {\n          if(Math.random()<.16 || brick.bonus) spawnPowerup(brick.x+brick.w/2,brick.y,brick.bonus);\n          explosions.push({x:brick.x+brick.w/2,y:brick.y+brick.h/2,r:24,col:brick.color,t:now()});\n          sfx('brick2');\n        }\n      }\n    }\n    // Powerups collect\n    for(let j=0;j<powerUps.length;++j) {\n      let p=powerUps[j];\n      if(p.x && Math.abs(b.x-p.x)<24 && Math.abs(b.y-p.y)<32) {\n        p.act();\n        powerUps.splice(j,1); sfx('power');\n      }\n    }\n    // Enemies\n    for(let e of enemies) {\n      if(Math.abs(b.x-e.x)<e.w/2+12 && Math.abs(b.y-e.y)<e.h/2+12) {\n        if(!b.ghost && !pnames.includes('GHOST')) b.vy*=-1;\n        e.hp-=b.fire?2:1;\n        sfx('hit');\n        if(e.hp<=0) { explosions.push({x:e.x,y:e.y,r:33,col:e.color,t:now()}); score+=35*mult; sfx('bomb'); e.x=-999; }\n      }\n    }\n    // Hazards kill ball\n    for(let h of hazards) if(Math.hypot(b.x-h.x,b.y-h.y)<h.r+b.r-2 && !b.ghost) {\n      if(player.shield>0 || player.invincible>0) { sfx('shield');\n        player.shield=0; player.invincible=0;\n        explosions.push({x:b.x,y:b.y,r:21,col:'#4fc3f7',t:now()});\n        b.vy*=-1;\n      } else {\n        balls.splice(i,1); i--;\n        sfx('gameover');\n      }\n    }\n    // LASER destroys brick\n    if(player.laser && player.laser>now() && Math.abs(b.x-(player.x+player.w/2))<19) {\n      for(let r=0;r<bricks.length;++r)\n      for(let c=0;c<bricks[r].length;++c) {\n        let brick=bricks[r][c];\n        if(!brick||brick.hp<=0) continue;\n        if(Math.abs(brick.x-(player.x+player.w/4))<24 && brick.y<player.y) {\n          brick.hp=0; score+=5*mult;\n          sfx('laser');\n        }\n      }\n    }\n    b.ghost=b.ghost?b.ghost-dt*1000:0;\n    b.fire=b.fire?b.fire-dt*1000:0;\n  }\n  // Powerups falling\n  for(let j=powerUps.length-1;j>=0;--j) {\n    let p=powerUps[j];\n    p.y+=p.vy;\n    if(p.y>H+20) powerUps.splice(j,1);\n    else if(Math.abs(p.x+0.5-player.x-player.w/2)<player.w/2+8 && Math.abs(p.y-player.y)<24) {\n      p.act(); powerUps.splice(j,1); sfx('power');\n    }\n  }\n  // Explosions shrink\n  for(let k=explosions.length-1;k>=0;--k) {\n    let e=explosions[k];\n    if(now()-e.t>425) explosions.splice(k,1);\n  }\n  // Enemies move\n  for(let e of enemies) {\n    e.x+=e.vx*e.dir;\n    if(e.x<e.w/2||e.x>W-e.w/2) {e.dir*=-1; e.x=clamp(e.x,e.w/2,W-e.w/2);}\n  }\n  // Hazards\n  for(let h of hazards) {\n    h.y+=h.vy;\n    if(h.y<h.r) {h.vy*=-1;h.y=h.r;}\n    if(h.y>H-h.r) {h.vy*=-1;h.y=H-h.r;}\n  }\n  // Player effects\n  player.shield=player.shield-dt*1000>0?player.shield-dt*1000:0;\n  player.invincible=player.invincible-dt*1000>0?player.invincible-dt*1000:0;\n  player.magnet=player.magnet-dt*1000>0?player.magnet-dt*1000:0;\n  // Combo streak timeout\n  if(comboStreak>0 && now()-comboTimer>1220) comboStreak=0;\n  // Remove dead bricks/enemies\n  enemies=enemies.filter(e=>e.x>-100 && e.hp>0);\n  // BALL LOSS HANDLING\n  if(balls.length==0 && !gameOver && started) {\n    if(lives>1) {\n      lives--;\n      balls.push({x:player.x+player.w/2, y:player.y-17, vx:rand(-4,4), vy:-8, r:11, color:'#4fc3f7'});\n      sfx('gameover');\n      comboStreak=0;\n    } else {\n      lives=0; gameOver=true; started=false; sfx('gameover');\n      setTimeout(()=>{checkHighScore();},350);\n    }\n  }\n  // LEVEL CLEAR\n  let remain=0;\n  for(let r=0;r<bricks.length;++r) for(let c=0;c<bricks[r].length;++c)\n    if(bricks[r][c] && bricks[r][c].hp>0) remain++;\n  if(remain==0 && !showLevelIntro && !showBlastOff && !gameOver) {\n    sfx('level');\n    if(level>=maxLevel) { victoryScreen(); return; }\n    level++; showLevelIntro=true;\n    levelIntroTimer=now();\n    showBlastOff = true; // Show transition before actual level\n    if (blastOffTimeout) clearTimeout(blastOffTimeout);\n    blastOffCallback = function() {\n      setupLevel(level); showLevelIntro=false; showBlastOff = false;\n      musicLoop(level);\n      gameLoop._last = performance.now();\n      window.__canvasAnimId = requestAnimationFrame(gameLoop);\n    };\n    blastOffTimeout = setTimeout(() => {\n      if (typeof blastOffCallback === 'function') {\n        blastOffCallback();\n        blastOffCallback = null;\n      }\n    }, 1550);\n  }\n}\nfunction gameLoop(ts) {\n  if(window.__canvasAnimId) cancelAnimationFrame(window.__canvasAnimId);\n  window.__canvasAnimId = requestAnimationFrame(gameLoop);\n  // Music\n  if (!showLevelIntro && !showBlastOff && started && !gameOver && !showVictory) {\n    musicLoop(level);\n  }\n  let last = gameLoop._last||performance.now();\n  let nowt = performance.now();\n  let dt = Math.min((nowt-last)/1000,0.08);\n  gameLoop._last=nowt;\n  //---\n  if(started && !showLevelIntro && !showBlastOff && !gameOver && !showVictory) update(dt);\n  draw();\n}\n//--- CONTROLS & UI\ncanvas.tabIndex=3;\ncanvas.focus();\ncanvas.addEventListener('keydown',e=>{\n  keys[e.key]=true;\n  if(e.key===' '&&!started) { resumeAudio(); resetGame(); }\n  if(gameOver || showVictory) {\n    if(e.key===' '||e.key=='Enter') { resumeAudio(); resetGame(); }\n  }\n});\ncanvas.addEventListener('keyup',e=>keys[e.key]=false);\ncanvas.addEventListener('mousedown',()=>{resumeAudio();if(!started) resetGame(); else if(gameOver||showVictory) resetGame();});\ncanvas.addEventListener('touchstart',function(e){\n  e.preventDefault(); resumeAudio();\n  if(!started){resetGame();return;}\n  if(gameOver||showVictory){resetGame();return;}\n  var rect=canvas.getBoundingClientRect();\n  var tx=e.touches[0].clientX-rect.left;\n  player.x=Math.max(0,Math.min(tx-player.w/2,W-player.w));\n},{passive:false});\ncanvas.addEventListener('touchmove',function(e){\n  e.preventDefault();\n  if(!started||gameOver||showVictory) return;\n  var rect=canvas.getBoundingClientRect();\n  var tx=e.touches[0].clientX-rect.left;\n  player.x=Math.max(0,Math.min(tx-player.w/2,W-player.w));\n},{passive:false});\nfunction checkHighScore() {\n  if(score > highScore) {\n    document.getElementById('initials-entry-bg').style.display='flex';\n    initialsPrompt = true;\n    setTimeout(()=>{document.getElementById('initials-input').focus();},30);\n  }\n}\nfunction victoryScreen() {\n  showVictory=true; showLevelIntro=false;\n  setTimeout(()=>{checkHighScore();},600);\n  sfx('victory');\n}\n//--- INITIALS UI\nlet entryBG=document.getElementById('initials-entry-bg');\nlet entryInput=document.getElementById('initials-input');\nlet entryBtn=document.getElementById('initials-ok-btn');\nentryInput.addEventListener('input',e=>{\n  entryInput.value=entryInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').substr(0,3);\n});\nentryBtn.onclick=()=>{\n  let n = entryInput.value || 'AAA';\n  highInitials = n.toUpperCase();\n  highScore = score;\n  saveHi();\n  initialsPrompt = false;\n  entryBG.style.display='none';\n  setTimeout(()=>{resetGame();},880);\n};\nentryInput.addEventListener('keydown',e=>{\n  if(e.key==='Enter') entryBtn.onclick();\n});\nfunction closeInitialsEntry(){entryBG.style.display=\"none\";initialsPrompt=false;}\n//--- MUTE BUTTON\nlet muteBtn=document.getElementById('mute-btn');\nmuteBtn.onclick=()=>{\n  audioMute=!audioMute;\n  muteBtn.classList.toggle('muted',audioMute);\n  muteBtn.textContent=audioMute?'🔇':'🔊';\n};\n// --- PLAYER MOVE ---\nfunction stepPlayer() {\n  if(keys['ArrowLeft']||keys['a']) player.x-=player.speed;\n  if(keys['ArrowRight']||keys['d']) player.x+=player.speed;\n  player.x=clamp(player.x,0,W-player.w);\n}\nsetInterval(()=>{if(started && !showLevelIntro && !showBlastOff && !gameOver && !showVictory) stepPlayer();},16);\nloadHi();\ndraw();\ngameLoop();\n</script>\n<script>\n(function(){\n  var t = window.traits;\n  if (!t || !t.score) return;\n  var _last = 0;\n  var _lastInit = '';\n  function getPlayerInitials() {\n    try { if (typeof getHighScore === 'function') { var h = getHighScore(); return h.initials || h.initial || ''; } } catch(e) {}\n    try { if (typeof highInitials === 'string' && highInitials) return highInitials; } catch(e) {}\n    try { if (typeof highInits === 'string' && highInits) return highInits; } catch(e) {}\n    try {\n      var hs = document.getElementById('hs');\n      if (hs) { var m = hs.textContent.match(/^([A-Z]{2,4})\\s/); if (m) return m[1]; }\n    } catch(e) {}\n    try {\n      for (var i = 0; i < localStorage.length; i++) {\n        var val = localStorage.getItem(localStorage.key(i));\n        if (!val) continue;\n        var sm = val.match(/^([A-Z]{2,4})\\s+\\d+$/);\n        if (sm) return sm[1];\n        try {\n          var obj = JSON.parse(val);\n          if (typeof obj === 'object' && obj) {\n            var init = obj.initials || obj.inits || obj.init || '';\n            if (init && typeof init === 'string' && init.length <= 4) return init;\n            if (obj.name && typeof obj.name === 'string' && obj.name.length <= 4 && typeof obj.score === 'number') return obj.name;\n          }\n        } catch(e2) {}\n      }\n    } catch(e) {}\n    return '';\n  }\n  function report(v) {\n    v = parseInt(v);\n    if (isNaN(v) || v < 0) return;\n    var init = getPlayerInitials();\n    if (v > _last || (v === _last && init && init !== _lastInit)) {\n      _last = v;\n      _lastInit = init;\n      t.score(v, init);\n    }\n  }\n  var el = document.getElementById('score');\n  if (el) {\n    new MutationObserver(function(){ report(el.textContent); })\n      .observe(el, {childList:true, characterData:true, subtree:true});\n  }\n  setInterval(function(){\n    try { if (typeof score === 'number') report(score); } catch(e){}\n    try { if (typeof game === 'object' && game && typeof game.score === 'number') report(game.score); } catch(e){}\n  }, 500);\n  function updateHS(sc, pl) {\n    var hs = document.getElementById('hs');\n    if (!hs) return;\n    var cur = hs.textContent.match(/(\\d+)/);\n    if (!cur || parseInt(cur[1]) >= sc) return;\n    var lbl = hs.textContent.match(/^(best|hi|hs|high)\\s*:\\s*/i);\n    var prefix = lbl ? lbl[0] : '';\n    hs.textContent = prefix + (pl ? pl + ' ' : '') + sc;\n  }\n  var synced = t.score();\n  var sv = (typeof synced === 'object' && synced) ? (synced.score || 0) : (synced || 0);\n  var sp = (typeof synced === 'object' && synced) ? (synced.player || '') : '';\n  if (sv > 0) updateHS(sv, sp);\n  window.addEventListener('message', function(e){\n    if (e.data && e.data.type === 'highscore-update' && e.data.score > 0) {\n      updateHS(e.data.score, e.data.player || '');\n    }\n  });\n})();\n</script>\n</body>\n</html>\n","created":"2026-04-16T23:17:17Z","game_key":"kilian-ai/s50266ddaec0","id":"kilian-ai__s50266ddaec0-260416231717-1","name":"Blast Zone!","resources":{},"version":"260416.210022"}
