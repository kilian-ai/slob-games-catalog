{"content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no\">\n<title>Neon Ball Toss</title>\n<style>\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;touch-action:none}\nbody{display:block;color:#fff}\ncanvas{display:block;width:100vw;height:100vh;background:#0a0a0a}\n</style>\n</head>\n<body>\n<canvas></canvas>\n<script>\n(async function(){\nif(window.__canvasAnimId) cancelAnimationFrame(window.__canvasAnimId);\nlet canvas=document.querySelector('canvas');\nlet ctx=canvas.getContext('2d');\nlet vw=innerWidth, vh=innerHeight, dpr=1;\nlet safeTop=0, safeBottom=0;\nfunction resize(){\n  dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));\n  vw=(window.visualViewport?window.visualViewport.width:innerWidth)||innerWidth;\n  vh=(window.visualViewport?window.visualViewport.height:innerHeight)||innerHeight;\n  canvas.width=Math.floor(vw*dpr);\n  canvas.height=Math.floor(vh*dpr);\n  canvas.style.width=vw+'px';\n  canvas.style.height=vh+'px';\n  ctx.setTransform(dpr,0,0,dpr,0,0);\n  let cs=getComputedStyle(document.documentElement);\n  safeTop=parseFloat(cs.getPropertyValue('env(safe-area-inset-top)'))||0;\n  safeBottom=parseFloat(cs.getPropertyValue('env(safe-area-inset-bottom)'))||0;\n}\nresize();\naddEventListener('resize',resize);\nif(window.visualViewport) visualViewport.addEventListener('resize',resize);\n\nlet sprites={};\nasync function loadSprite(path,pad){\n  if(window.traits&&traits.loadVFSImage) return await traits.loadVFSImage(path,{padding:pad||2});\n  let img=new Image();\n  img.src=path;\n  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;});\n  return img;\n}\nsprites.hoop=await loadSprite('sprites/hoop.png',2);\nsprites.ball=await loadSprite('sprites/ball.png',2);\nsprites.launcher=await loadSprite('sprites/launcher.png',2);\nsprites.crate=await loadSprite('sprites/crate.png',2);\nsprites.drone=await loadSprite('sprites/drone.png',2);\nsprites.star=await loadSprite('sprites/star.png',2);\nsprites.power_life=await loadSprite('sprites/power_life.png',2);\nsprites.power_shield=await loadSprite('sprites/power_shield.png',2);\nsprites.power_speed=await loadSprite('sprites/power_speed.png',2);\nsprites.power_slow=await loadSprite('sprites/power_slow.png',2);\nsprites.power_multi=await loadSprite('sprites/power_multi.png',2);\nsprites.power_laser=await loadSprite('sprites/power_laser.png',2);\nsprites.power_magnet=await loadSprite('sprites/power_magnet.png',2);\nsprites.power_double=await loadSprite('sprites/power_double.png',2);\nsprites.power_invincible=await loadSprite('sprites/power_invincible.png',2);\nsprites.power_bomb=await loadSprite('sprites/power_bomb.png',2);\n\nlet AC=window.AudioContext||window.webkitAudioContext;\nlet audioCtx=AC?new AC():null;\nlet master=audioCtx?audioCtx.createGain():null;\nlet musicGain=audioCtx?audioCtx.createGain():null;\nlet mute=false;\nif(audioCtx){master.gain.value=0.18;musicGain.gain.value=0.12;musicGain.connect(master);master.connect(audioCtx.destination);} \nfunction resumeAudio(){if(audioCtx&&audioCtx.state!=='running') audioCtx.resume();}\nfunction tone(freq,time,dur,type,vol){\n  if(!audioCtx||mute) return;\n  let o=audioCtx.createOscillator();\n  let g=audioCtx.createGain();\n  o.type=type||'sine';\n  o.frequency.setValueAtTime(freq,audioCtx.currentTime+time);\n  g.gain.setValueAtTime(0.0001,audioCtx.currentTime+time);\n  g.gain.exponentialRampToValueAtTime(vol||0.05,audioCtx.currentTime+time+0.01);\n  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+time+dur);\n  o.connect(g);g.connect(master);o.start(audioCtx.currentTime+time);o.stop(audioCtx.currentTime+time+dur+0.02);\n}\nfunction sfxHit(){tone(280,0,0.08,'square',0.04);tone(420,0.02,0.06,'triangle',0.03);}\nfunction sfxDestroy(){tone(190,0,0.09,'sawtooth',0.05);tone(110,0.03,0.12,'square',0.03);}\nfunction sfxPower(){tone(520,0,0.08,'triangle',0.05);tone(760,0.06,0.12,'triangle',0.05);}\nfunction sfxLevel(){tone(440,0,0.1,'sine',0.05);tone(660,0.11,0.1,'sine',0.05);tone(880,0.22,0.16,'sine',0.05);}\nfunction sfxGameOver(){tone(300,0,0.12,'sawtooth',0.05);tone(220,0.13,0.14,'sawtooth',0.05);tone(160,0.28,0.24,'sawtooth',0.05);}\nfunction sfxHigh(){tone(660,0,0.09,'triangle',0.05);tone(990,0.1,0.12,'triangle',0.05);tone(1320,0.24,0.18,'triangle',0.05);}\nlet musicNodes=[];\nfunction stopMusic(){for(let i=0;i<musicNodes.length;i++){try{musicNodes[i].stop();}catch(e){}}musicNodes=[];}\nfunction startMusic(){\n  if(!audioCtx) return; stopMusic(); if(mute) return;\n  let bpm=88+levelIndex*8;\n  let beat=60/bpm;\n  let now=audioCtx.currentTime;\n  let notes=[220,246.94,261.63,293.66,329.63,392,329.63,293.66];\n  let bass=[110,123.47,98,146.83];\n  for(let bar=0;bar<16;bar++){\n    for(let i=0;i<8;i++){\n      let t=now+bar*8*beat+i*beat;\n      let o=audioCtx.createOscillator();\n      let g=audioCtx.createGain();\n      o.type=bar%2===0?'triangle':'square';\n      o.frequency.value=notes[(i+levelIndex+bar)%notes.length]*(1+levelIndex*0.02);\n      g.gain.value=0.0001;\n      g.gain.setValueAtTime(0.0001,t);\n      g.gain.linearRampToValueAtTime(0.03+levelIndex*0.002,t+0.02);\n      g.gain.exponentialRampToValueAtTime(0.0001,t+beat*0.9);\n      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+beat);\n      musicNodes.push(o);\n    }\n    for(let j=0;j<4;j++){\n      let t2=now+bar*8*beat+j*2*beat;\n      let o2=audioCtx.createOscillator();\n      let g2=audioCtx.createGain();\n      o2.type='sine';\n      o2.frequency.value=bass[(j+levelIndex)%bass.length];\n      g2.gain.setValueAtTime(0.0001,t2);\n      g2.gain.linearRampToValueAtTime(0.025,t2+0.03);\n      g2.gain.exponentialRampToValueAtTime(0.0001,t2+beat*1.8);\n      o2.connect(g2);g2.connect(musicGain);o2.start(t2);o2.stop(t2+beat*2);\n      musicNodes.push(o2);\n    }\n  }\n}\nsetInterval(function(){if(state==='play'&&audioCtx&&audioCtx.state==='running'&&!mute&&musicNodes.length<8) startMusic();},2000);\n\nlet high=JSON.parse(localStorage.getItem('neonBallTossHigh')||'{\"initials\":\"AAA\",\"score\":0}');\nif(!high.initials) high={initials:'AAA',score:0};\nlet levelThemes=[\n  {name:'Rookie Court',bg:'#101820',accent:'#00ff88'},\n  {name:'Sky Alley',bg:'#0b1630',accent:'#4fc3f7'},\n  {name:'Crate Chaos',bg:'#22110c',accent:'#ff6b35'},\n  {name:'Drone Rush',bg:'#1a1028',accent:'#b388ff'},\n  {name:'Neon Storm',bg:'#071d1a',accent:'#00e5ff'},\n  {name:'Magnet Lab',bg:'#161616',accent:'#ffea00'},\n  {name:'Fire Ring',bg:'#2a0f0f',accent:'#ff7043'},\n  {name:'Champion Dome',bg:'#081018',accent:'#7cffcb'}\n];\nlet powerDefs=[\n  {id:'life',label:'1UP',color:'#ff6b6b',sprite:'power_life',dur:0},\n  {id:'shield',label:'SHD',color:'#4fc3f7',sprite:'power_shield',dur:10},\n  {id:'speed',label:'SPD',color:'#ffd54f',sprite:'power_speed',dur:8},\n  {id:'slow',label:'SLW',color:'#80deea',sprite:'power_slow',dur:6},\n  {id:'multi',label:'MBL',color:'#ce93d8',sprite:'power_multi',dur:0},\n  {id:'laser',label:'LSR',color:'#ef5350',sprite:'power_laser',dur:8},\n  {id:'magnet',label:'MAG',color:'#a5d6a7',sprite:'power_magnet',dur:10},\n  {id:'double',label:'2X',color:'#fff176',sprite:'power_double',dur:10},\n  {id:'invincible',label:'INV',color:'#ffffff',sprite:'power_invincible',dur:6},\n  {id:'bomb',label:'BMB',color:'#ff8a65',sprite:'power_bomb',dur:0}\n];\nlet levelIndex=0,score=0,lives=3,state='intro',stateTimer=1.5,lastTime=0;\nlet particles=[],balls=[],targets=[],powerups=[],lasers=[],floatTexts=[];\nlet active={shield:0,speed:0,slow:0,laser:0,magnet:0,double:0,invincible:0};\nlet powerSpawnTimer=4;\nlet launcher={x:0,y:0,w:80,h:80,aim:-1.2,cool:0};\nlet hoop={x:0,y:0,w:120,h:80,move:0,dir:1};\nlet pointerDown=false,pointerX=0,pointerY=0;\nlet initialsEntry='';\n\nfunction resetActive(){for(let k in active) active[k]=0;}\nfunction makeBall(x,y,vx,vy,ghost){return {x:x,y:y,vx:vx,vy:vy,r:18,alive:true,trail:[],scoredHoop:false,ghost:!!ghost};}\nfunction launchBall(angle,power){\n  let sp=(active.speed>0?900:760)*(active.slow>0?0.85:1);\n  let vx=Math.cos(angle)*power*sp;\n  let vy=Math.sin(angle)*power*sp;\n  balls.push(makeBall(launcher.x,launcher.y-28,vx,vy,false));\n  sfxHit();\n}\nfunction spawnParticles(x,y,c,n){for(let i=0;i<n;i++) particles.push({x:x,y:y,vx:(Math.random()*2-1)*220,vy:(Math.random()*2-1)*220,life:0.5+Math.random()*0.5,color:c,size:2+Math.random()*4});}\nfunction addFloat(x,y,t,col){floatTexts.push({x:x,y:y,text:t,color:col,life:1});}\nfunction rectsOverlap(a,b){return a.x<a.x+a.w&&a.x+b.w>b.x&&a.x<a.x+a.w&&a.x+a.w>b.x&&a.y+a.h>b.y&&a.y<b.y+b.h;}\nfunction circleRect(ball,obj){let cx=Math.max(obj.x,Math.min(ball.x,obj.x+obj.w));let cy=Math.max(obj.y,Math.min(ball.y,obj.y+obj.h));let dx=ball.x-cx,dy=ball.y-cy;return dx*dx+dy*dy<ball.r*ball.r;}\nfunction spawnPower(x,y,forced){\n  let def=powerDefs[Math.floor(Math.random()*powerDefs.length)];\n  if(forced){def=powerDefs[forced];}\n  powerups.push({x:x,y:y,w:34,h:34,vy:90+Math.random()*40,def:def,life:10});\n}\nfunction applyPower(id){\n  if(id==='life'){lives++;addFloat(launcher.x,launcher.y-60,'+1 LIFE','#ff6b6b');}\n  if(id==='shield') active.shield=10;\n  if(id==='speed') active.speed=8;\n  if(id==='slow') active.slow=6;\n  if(id==='multi'){\n    let extra=[];\n    for(let i=0;i<balls.length;i++) extra.push(makeBall(balls[i].x,balls[i].y,balls[i].vx*0.8+80,balls[i].vy*0.9-60,true));\n    if(extra.length===0) extra.push(makeBall(launcher.x,launcher.y-20,180,-680,true));\n    balls=balls.concat(extra.slice(0,3));\n  }\n  if(id==='laser') active.laser=8;\n  if(id==='magnet') active.magnet=10;\n  if(id==='double') active.double=10;\n  if(id==='invincible') active.invincible=6;\n  if(id==='bomb'){\n    for(let i=targets.length-1;i>=0;i--){ if(targets[i].type!=='star'){score+=10*(active.double>0?2:1);spawnParticles(targets[i].x+targets[i].w/2,targets[i].y+targets[i].h/2,'#ff8a65',10);targets.splice(i,1);} }\n    addFloat(vw*0.5,vh*0.4,'CLEAR!','#ff8a65');\n  }\n  sfxPower();\n}\nfunction saveHigh(){localStorage.setItem('neonBallTossHigh',JSON.stringify(high));}\nfunction startLevel(i){\n  levelIndex=i;\n  resetActive();\n  balls=[];targets=[];powerups=[];lasers=[];particles=[];floatTexts=[];\n  hoop.x=vw*0.5-60; hoop.y=120+safeTop; hoop.w=Math.min(150,vw*0.26); hoop.h=hoop.w*0.62; hoop.move=40+i*14; hoop.dir=1;\n  launcher.x=vw*0.5; launcher.y=vh-(140+safeBottom); launcher.w=Math.min(120,vw*0.22); launcher.h=launcher.w; launcher.aim=-1.2; launcher.cool=0;\n  let rows=2+Math.floor(i/2), cols=3+Math.min(4,i);\n  let top=210+safeTop; let gap=12; let tw=Math.min(86,(vw-40-gap*(cols-1))/cols); let th=tw*0.72;\n  for(let r=0;r<rows;r++){\n    for(let c=0;c<cols;c++){\n      if((i===1&&r===1&&c===1)||(i===3&&r===0&&c%2===0)||(i===5&&Math.random()<0.2)) continue;\n      let type=(Math.random()<0.25+i*0.04)?'drone':'crate';\n      targets.push({type:type,x:20+c*(tw+gap)+((r%2)*10),y:top+r*(th+gap),w:tw,h:th,hp:type==='drone'?2:1,phase:Math.random()*6.28,baseY:top+r*(th+gap)});\n    }\n  }\n  for(let s=0;s<1+Math.floor(i/2);s++) targets.push({type:'star',x:40+Math.random()*(vw-80),y:top-40-Math.random()*70,w:38,h:38,hp:1,phase:Math.random()*6.28,baseY:top-50});\n  state='levelIntro'; stateTimer=1.6; powerSpawnTimer=3; startMusic();\n}\nfunction nextLevel(){if(levelIndex<levelThemes.length-1){startLevel(levelIndex+1);sfxLevel();}else{state='victory';stateTimer=999;}}\nfunction loseLife(){\n  if(active.invincible>0) return;\n  if(active.shield>0){active.shield=0;addFloat(launcher.x,launcher.y-50,'SHIELD SAVED','#4fc3f7');return;}\n  lives--; sfxGameOver();\n  if(lives<=0){\n    if(score>high.score){state='newHigh';initialsEntry='';sfxHigh();}\n    else{state='gameover';}\n  }else{\n    balls=[]; launcher.cool=0; state='respawn'; stateTimer=1.1;\n  }\n}\nfunction restartGame(){score=0;lives=3;startLevel(0);state='levelIntro';}\nstartLevel(0);\n\nfunction fireLaser(){\n  if(active.laser<=0||launcher.cool>0) return;\n  lasers.push({x:launcher.x-14,y:launcher.y-30,vy:-900});\n  lasers.push({x:launcher.x+14,y:launcher.y-30,vy:-900});\n  launcher.cool=0.24; sfxHit();\n}\nfunction handlePointer(type,x,y){\n  resumeAudio();\n  pointerX=x; pointerY=y;\n  if(type==='down'){\n    pointerDown=true;\n    if(y<56+safeTop&&x>vw-86){mute=!mute;if(master) master.gain.value=mute?0:0.18;if(mute) stopMusic(); else startMusic();return;}\n    if(state==='title'){restartGame();return;}\n    if(state==='gameover'||state==='victory'){restartGame();return;}\n  }\n  if(type==='up'){\n    if(state==='play'||state==='respawn'){\n      let dx=x-launcher.x; let dy=y-launcher.y; let ang=Math.atan2(dy,dx); ang=Math.min(-0.35,Math.max(-2.8,ang));\n      launcher.aim=ang; let power=Math.min(1,Math.max(0.45,Math.hypot(dx,dy)/Math.max(180,vh*0.28)));\n      if(state==='play') launchBall(ang,power);\n    }\n    pointerDown=false;\n  }\n  if(type==='move'&&pointerDown&&(state==='play'||state==='respawn')){\n    let dx=x-launcher.x; let dy=y-launcher.y; launcher.aim=Math.min(-0.35,Math.max(-2.8,Math.atan2(dy,dx)));\n  }\n}\ncanvas.addEventListener('pointerdown',e=>handlePointer('down',e.clientX,e.clientY));\ncanvas.addEventListener('pointermove',e=>handlePointer('move',e.clientX,e.clientY));\ncanvas.addEventListener('pointerup',e=>handlePointer('up',e.clientX,e.clientY));\ncanvas.addEventListener('pointercancel',e=>handlePointer('up',e.clientX,e.clientY));\naddEventListener('keydown',function(e){\n  resumeAudio();\n  if(state==='newHigh'){\n    if(e.key==='Backspace'){initialsEntry=initialsEntry.slice(0,-1);return;}\n    if(e.key==='Enter'&&initialsEntry.length===3){high={initials:initialsEntry.toUpperCase(),score:score};saveHigh();state='gameover';return;}\n    if(/^[a-z0-9]$/i.test(e.key)&&initialsEntry.length<3) initialsEntry+=e.key.toUpperCase();\n    return;\n  }\n  if(e.key==='m'||e.key==='M'){mute=!mute;if(master) master.gain.value=mute?0:0.18;if(mute) stopMusic(); else startMusic();}\n  if(e.key===' '&&state==='play') fireLaser();\n  if((state==='gameover'||state==='victory'||state==='title')&&e.key==='Enter') restartGame();\n});\n\nfunction update(dt){\n  if(state==='levelIntro'||state==='respawn'){stateTimer-=dt;if(stateTimer<=0) state='play';}\n  if(state!=='play') return;\n  let timeScale=active.slow>0?0.72:1;\n  let sdt=dt*timeScale;\n  powerSpawnTimer-=dt;\n  if(powerSpawnTimer<=0){spawnPower(60+Math.random()*(vw-120),120+safeTop+Math.random()*180);powerSpawnTimer=5.5-Math.min(2.5,levelIndex*0.25);}\n  for(let k in active) if(active[k]>0) active[k]-=dt;\n  hoop.x+=hoop.dir*(50+levelIndex*12)*dt; if(hoop.x<22||hoop.x+hoop.w>vw-22){hoop.dir*=-1;sfxHit();}\n  launcher.cool=Math.max(0,launcher.cool-dt);\n  if(pointerDown){let dx=pointerX-launcher.x; let dy=pointerY-launcher.y; launcher.aim=Math.min(-0.35,Math.max(-2.8,Math.atan2(dy,dx)));}\n  for(let i=targets.length-1;i>=0;i--){\n    let t=targets[i];\n    if(t.type==='drone'){t.phase+=dt*(1.5+levelIndex*0.2);t.y=t.baseY+Math.sin(t.phase)*18;t.x+=Math.cos(t.phase*0.7)*18*dt;}\n    if(t.type==='star'){t.phase+=dt*2;t.y=t.baseY+Math.sin(t.phase)*14;}\n  }\n  for(let i=lasers.length-1;i>=0;i--){\n    let l=lasers[i]; l.y+=l.vy*dt; if(l.y<-30){lasers.splice(i,1);continue;}\n    for(let j=targets.length-1;j>=0;j--){let t=targets[j]; if(l.x>t.x&&l.x<t.x+t.w&&l.y>t.y&&l.y<t.y+t.h){t.hp--;spawnParticles(l.x,l.y,'#ef5350',6);lasers.splice(i,1);if(t.hp<=0){let pts=t.type==='star'?30:15;score+=pts*(active.double>0?2:1);spawnParticles(t.x+t.w/2,t.y+t.h/2,t.type==='star'?'#ffea00':'#ff6b35',12);if(Math.random()<0.45) spawnPower(t.x+t.w/2,t.y+t.h/2);targets.splice(j,1);sfxDestroy();}break;}}\n  }\n  for(let i=balls.length-1;i>=0;i--){\n    let b=balls[i];\n    b.vy+=980*sdt*(active.invincible>0?0.8:1);\n    b.x+=b.vx*sdt; b.y+=b.vy*sdt;\n    b.trail.push({x:b.x,y:b.y,life:0.3}); if(b.trail.length>8) b.trail.shift();\n    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*0.88;sfxHit();}\n    if(b.x>vw-b.r){b.x=vw-b.r;b.vx=-Math.abs(b.vx)*0.88;sfxHit();}\n    if(b.y<b.r+safeTop+50){b.y=b.r+safeTop+50;b.vy=Math.abs(b.vy)*0.88;sfxHit();}\n    let rimY=hoop.y+hoop.h*0.58;\n    let rimL={x:hoop.x+hoop.w*0.22,y:rimY,w:10,h:10};\n    let rimR={x:hoop.x+hoop.w*0.78-10,y:rimY,w:10,h:10};\n    if(circleRect(b,rimL)||circleRect(b,rimR)){b.vy=-Math.abs(b.vy)*0.92; b.vx*=0.92; sfxHit();}\n    let inHoop=b.x>hoop.x+hoop.w*0.26&&b.x<hoop.x+hoop.w*0.74&&b.y>hoop.y+hoop.h*0.42&&b.y<hoop.y+hoop.h*0.86&&b.vy>0;\n    if(inHoop&&!b.scoredHoop){b.scoredHoop=true; let pts=20+levelIndex*5; score+=pts*(active.double>0?2:1); addFloat(b.x,b.y,'SWISH +'+pts,'#00ff88'); spawnParticles(b.x,b.y,'#00ff88',14); sfxDestroy(); if(Math.random()<0.5) spawnPower(b.x,b.y);}\n    for(let j=targets.length-1;j>=0;j--){\n      let t=targets[j];\n      if(circleRect(b,t)){\n        t.hp--; let dx=b.x-(t.x+t.w/2), dy=b.y-(t.y+t.h/2);\n        if(Math.abs(dx)>Math.abs(dy)) b.vx=(dx>0?1:-1)*Math.abs(b.vx||240); else b.vy=(dy>0?1:-1)*Math.abs(b.vy||240);\n        b.vx*=0.94; b.vy*=0.94; spawnParticles(b.x,b.y,t.type==='star'?'#ffea00':'#4fc3f7',8); sfxHit();\n        if(t.hp<=0){let pts=t.type==='star'?25:12+(t.type==='drone'?8:0); score+=pts*(active.double>0?2:1); addFloat(t.x+t.w/2,t.y,'+'+pts,t.type==='star'?'#ffea00':'#ff6b35'); if(Math.random()<0.38||t.type==='star') spawnPower(t.x+t.w/2,t.y+t.h/2); targets.splice(j,1); sfxDestroy();}\n      }\n    }\n    for(let p=powerups.length-1;p>=0;p--){let pw=powerups[p]; let dx=b.x-(pw.x+pw.w/2),dy=b.y-(pw.y+pw.h/2); if(dx*dx+dy*dy<(b.r+pw.w*0.45)*(b.r+pw.w*0.45)){applyPower(pw.def.id); powerups.splice(p,1);}}\n    if(active.magnet>0&&b.y>vh*0.55){let tx=hoop.x+hoop.w/2; b.vx+=(tx-b.x)*1.4*dt*60;}\n    if(b.y>vh+80){balls.splice(i,1); if(balls.length===0) loseLife();}\n  }\n  for(let i=powerups.length-1;i>=0;i--){let p=powerups[i]; p.y+=p.vy*dt; p.life-=dt; if(p.y>vh+40||p.life<=0) powerups.splice(i,1);}\n  for(let i=particles.l
